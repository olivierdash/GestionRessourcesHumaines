spring.application.name=sirh
spring.datasource.url=jdbc:postgresql://localhost:5432/sirh
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Gestion des sessions (nettoyage et désactivation)
spring.session.jdbc.initialize-schema=never
spring.session.store-type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

# 🔥 LA LIGNE MANQUANTE : Évite les erreurs de chargement des relations (Lazy Loading) dans Thymeleaf
spring.jpa.open-in-view=true
