<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SIRH - Connexion</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { background-color: var(--primary-blue); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="card shadow-lg border-0 login-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">SIRH <span class="text-yellow">Pro</span></h2>
                <p class="text-muted">Connectez-vous à votre espace</p>
            </div>

            <!-- Formulaire géré par Spring Security -->
            <form th:action="@{/utilisateur/login}" method="post">
                
                <div th:if="${param.error}" class="alert alert-danger">
                    Email ou mot de passe incorrect.
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    Vous avez été déconnecté.
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="motDePasse" class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" id="motDePasse" name="motDePasse" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">Se connecter</button>
            </form>
        </div>
    </div>

</body>
</html>
