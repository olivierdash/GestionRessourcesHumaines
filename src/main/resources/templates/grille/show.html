<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="fr"
      th:replace="~{dashboard :: layout(content=~{::mainContent})}">

<body>
<main th:fragment="mainContent" class="app-page">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/grilles}" class="back-link">
                &larr; Retour aux grilles
            </a>

            <h2 class="page-title">
                Grille salariale
            </h2>
        </div>

        <a th:href="@{/grilles/{id}/edit(id=${grille.idGrille})}"
           class="btn-brand">
            Modifier
        </a>
    </div>

    <div class="card-x">
        <h5 class="card-head">Détails de la grille</h5>

        <div class="card-pad">
            <div class="row g-4">

                <div class="col-md-6">
                    <span class="lbl">Poste</span>
                    <div class="fw-semibold"
                         th:text="${grille.poste.intitule}">
                    </div>
                </div>

                <div class="col-md-6">
                    <span class="lbl">Département</span>
                    <div class="fw-semibold"
                         th:text="${grille.departement.titre}">
                    </div>
                </div>

                <div class="col-md-4">
                    <span class="lbl">Salaire minimum</span>
                    <div class="fw-semibold"
                         th:text="${grille.salaireMin}">
                    </div>
                </div>

                <div class="col-md-4">
                    <span class="lbl">Salaire moyen</span>
                    <div class="fw-semibold"
                         th:text="${grille.salaireMoyen}">
                    </div>
                </div>

                <div class="col-md-4">
                    <span class="lbl">Salaire maximum</span>
                    <div class="fw-semibold"
                         th:text="${grille.salaireMax}">
                    </div>
                </div>

            </div>
        </div>
    </div>

</main>
</body>
</html>
