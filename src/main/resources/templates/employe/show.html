<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div>
            <a th:href="@{/employes}" class="inline-flex items-center gap-1 text-sm text-on-surface-variant hover:text-primary transition-colors mb-2">
                &larr; Retour à la liste
            </a>
            <h2 class="font-headline-xl text-headline-xl text-on-surface font-bold flex flex-wrap items-center gap-3">
                Fiche Employé
                <span class="px-3 py-1 bg-surface-container text-primary font-code-num text-sm rounded-full font-semibold"
                      th:text="'#' + ${employe.idEmployer}">
                </span>
            </h2>
        </div>

        <!-- Contenu principal -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Colonne de gauche (Infos principales) -->
            <div class="lg:col-span-2">
                <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high h-full overflow-hidden">
                    <div class="p-6 border-b border-surface-container-high bg-surface-container-low/30">
                        <h3 class="font-title-sm text-title-sm text-on-surface font-semibold">Informations professionnelles</h3>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <span class="block text-xs font-semibold text-outline uppercase tracking-wider mb-1">Matricule</span>
                                <div class="text-xl font-bold font-mono text-on-surface" th:text="${employe.matricule}">MAT-2024-001</div>
                            </div>
                            <div>
                                <span class="block text-xs font-semibold text-outline uppercase tracking-wider mb-1">Date d'embauche</span>
                                <div class="text-base font-medium text-on-surface" th:text="${#temporals.format(employe.hiringDate, 'dd MMMM yyyy')}">01 Janvier 2024</div>
                            </div>
                        </div>

                        <hr class="my-6 border-surface-container-high">

                        <div>
                            <span class="block text-xs font-semibold text-outline uppercase tracking-wider mb-2">Statut actuel</span>
                            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold"
                                  th:classappend="${employe.statusEmployer == 'ACTIF' ? 'bg-green-100 text-green-700' : 
                                                  (employe.statusEmployer == 'SORTI' ? 'bg-red-100 text-red-700' : 'bg-surface-container text-on-surface-variant')}"
                                  th:text="${employe.statusEmployer}">
                                ACTIF
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Colonne de droite (Résumé & Actions) -->
            <div class="lg:col-span-1 flex flex-col gap-6">

                <!-- Carte Avatar / Profil -->
                <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high text-center p-6">
                    <div class="w-20 h-20 mx-auto rounded-full bg-primary text-white flex items-center justify-center font-bold text-3xl mb-4">
                        <span th:text="${#strings.substring(employe.matricule, 0, 1)}">M</span>
                    </div>
                    <h5 class="text-lg font-bold text-on-surface m-0" th:text="${employe.matricule}">MAT-2024-001</h5>
                    <p class="text-xs text-outline mt-1 mb-0">Identifiant interne</p>
                </div>

                <!-- Actions rapides -->
                <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
                    <div class="p-6 border-b border-surface-container-high bg-surface-container-low/30">
                        <h3 class="font-title-sm text-title-sm text-on-surface font-semibold">Actions rapides</h3>
                    </div>
                    <div class="p-6 flex flex-col gap-3">
                        <button class="w-full h-10 px-4 rounded-lg bg-surface-container text-on-surface-variant font-medium text-sm transition-colors border border-surface-container-high opacity-50 cursor-not-allowed" type="button" disabled>
                            Modifier la fiche
                        </button>
                        <button class="w-full h-10 px-4 rounded-lg bg-red-50 text-red-600 font-medium text-sm transition-colors border border-red-200 opacity-50 cursor-not-allowed" type="button" disabled>
                            Marquer comme sorti
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </main>
</body>
</html>
