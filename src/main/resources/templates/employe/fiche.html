<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div>
            <a th:href="@{/propositions}" class="inline-flex items-center gap-1 text-sm text-on-surface-variant hover:text-primary transition-colors mb-2">
                &larr; Propositions
            </a>
            <h1 class="font-headline-xl text-headline-xl text-on-surface font-bold flex flex-wrap items-center gap-3">
                Fiche salarié
                <span class="px-3 py-1 bg-primary text-on-primary font-code-num text-sm rounded-full font-semibold tracking-wide" 
                      th:text="${employe.matricule}">
                </span>
            </h1>
        </div>

        <!-- Message de succès -->
        <div th:if="${succes}" class="p-4 rounded-lg bg-green-50 text-green-700 border border-green-200 text-sm font-medium" th:text="${succes}"></div>

        <!-- Carte d'informations générales -->
        <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
            <div class="p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <span class="block text-xs font-semibold text-outline uppercase tracking-wider mb-1">Nom complet</span>
                    <div class="text-base font-medium text-on-surface" th:text="${employe.candidature.candidat.prenom + ' ' + employe.candidature.candidat.nom}"></div>
                </div>
                <div>
                    <span class="block text-xs font-semibold text-outline uppercase tracking-wider mb-1">Matricule</span>
                    <div class="text-base font-medium font-mono text-on-surface" th:text="${employe.matricule}"></div>
                </div>
                <div>
                    <span class="block text-xs font-semibold text-outline uppercase tracking-wider mb-1">Date d'embauche</span>
                    <div class="text-base font-medium text-on-surface" th:text="${#temporals.format(employe.hiringDate, 'dd/MM/yyyy')}"></div>
                </div>
                <div>
                    <span class="block text-xs font-semibold text-outline uppercase tracking-wider mb-1">Statut</span>
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold"
                          th:classappend="${employe.statusEmployer == 'ACTIF' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700'}"
                          th:text="${employe.statusEmployer}">
                    </span>
                </div>
            </div>
        </div>

        <!-- Section Contrats -->
        <h2 class="font-title-sm text-title-sm text-on-surface font-bold mt-2">Contrats</h2>
        <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
            <div class="overflow-x-auto">
                <table class="sirh-table">
                    <thead>
                        <tr>
                            <th scope="col">Type</th>
                            <th scope="col">Poste</th>
                            <th scope="col">Début</th>
                            <th scope="col">Fin</th>
                            <th scope="col">Salaire mensuel</th>
                            <th scope="col">Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(contrats)}">
                            <td colspan="6" class="td-empty">Aucun contrat enregistré.</td>
                        </tr>
                        <tr th:each="c : ${contrats}">
                            <td class="font-medium" th:text="${c.typeContrat.libelle}"></td>
                            <td th:text="${c.poste.intitule}"></td>
                            <td th:text="${#temporals.format(c.dateDebut, 'dd/MM/yyyy')}"></td>
                            <td th:text="${c.dateFin != null} ? ${#temporals.format(c.dateFin, 'dd/MM/yyyy')} : '-'"></td>
                            <td class="font-mono" th:text="${c.salaireMensuel}"></td>
                            <td>
                                <span class="text-xs font-semibold" th:text="${c.status}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Section Affectations -->
        <h2 class="font-title-sm text-title-sm text-on-surface font-bold mt-2">Affectations</h2>
        <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
            <div class="overflow-x-auto">
                <table class="sirh-table">
                    <thead>
                        <tr>
                            <th scope="col">Poste</th>
                            <th scope="col">Début</th>
                            <th scope="col">Fin</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(affectations)}">
                            <td colspan="3" class="td-empty">Aucune affectation enregistrée.</td>
                        </tr>
                        <tr th:each="a : ${affectations}">
                            <td class="font-medium" th:text="${a.poste.intitule}"></td>
                            <td th:text="${#temporals.format(a.dateDebut, 'dd/MM/yyyy')}"></td>
                            <td th:text="${a.dateFin != null} ? ${#temporals.format(a.dateFin, 'dd/MM/yyyy')} : '-'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</body>
</html>
