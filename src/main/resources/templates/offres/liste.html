<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-2">
            <h2 class="text-3xl font-bold text-on-surface">Liste des offres d'emploi</h2>
            <a th:href="@{/offres/creer}" class="inline-flex items-center gap-2 h-10 px-4 rounded-lg bg-primary text-on-primary hover:bg-primary-container transition-colors shadow-sm font-medium text-sm">
                + Créer une nouvelle offre
            </a>
        </div>

        <!-- Messages -->
        <div th:if="${success}" class="p-4 rounded-lg bg-green-50 text-green-700 border border-green-200 text-sm font-medium" th:text="${success}"></div>
        <div th:if="${error}" class="p-4 rounded-lg bg-red-50 text-red-600 border border-red-200 text-sm font-medium" th:text="${error}"></div>

        <!-- Tableau -->
        <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden flex flex-col">
            <div class="overflow-x-auto">
                <table class="sirh-table">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Titre</th>
                            <th scope="col">Statut</th>
                            <th scope="col">Date de publication</th>
                            <th scope="col" class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${offres.isEmpty()}">
                            <td colspan="5" class="td-empty">
                                Aucune offre disponible.
                            </td>
                        </tr>
                        <tr th:each="offre : ${offres}">
                            <td class="font-code-num text-outline whitespace-nowrap" th:text="${offre.idOffre}"></td>
                            <td class="font-medium text-on-surface" th:text="${offre.titre}"></td>
                            <td>
                                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold"
                                      th:classappend="${offre.statut.id == 1 ? 'bg-surface-container text-on-surface-variant' : 'bg-green-100 text-green-700'}"
                                      th:text="${offre.statut.libelle}">
                                </span>
                            </td>
                            <td class="text-on-surface-variant" 
                                th:classappend="${offre.datePublication == null} ? 'text-outline'"
                                th:text="${offre.datePublication != null ? offre.datePublication : 'En attente'}">
                            </td>
                            <td class="text-right whitespace-nowrap">
                                <!-- Bouton Publier -->
                                <form th:if="${offre.statut.id == 1}" 
                                      th:action="@{/offres/{id}/publier(id=${offre.idOffre})}" 
                                      method="post" class="inline">
                                    <button type="submit" class="inline-flex items-center justify-center h-8 px-3 rounded-lg bg-primary text-white hover:bg-primary-container text-xs font-medium transition-colors shadow-sm">
                                        Publier
                                    </button>
                                </form>

                                <!-- Lien vers les candidatures -->
                                <a th:href="@{/offres/{id}/candidatures(id=${offre.idOffre})}" 
                                   class="inline-flex items-center justify-center h-8 px-3 rounded-lg bg-surface-container text-on-surface hover:bg-surface-container-high text-xs font-medium transition-colors border border-surface-container-high ml-2">
                                    Voir Candidatures
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</body>
</html>
