<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-3xl mx-auto flex flex-col gap-6 w-full">

        <div>
            <a th:href="@{/offres}" class="inline-flex items-center gap-1 text-sm text-on-surface-variant hover:text-primary transition-colors mb-2">
                &larr; Retour à la liste
            </a>
            <h2 class="text-3xl font-bold text-on-surface">Créer une nouvelle offre</h2>
        </div>

        <div class="w-full">
            <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
                <div class="p-6 md:p-8">

                    <div th:if="${error}" class="p-4 rounded-lg bg-red-50 text-red-600 border border-red-200 text-sm font-medium mb-6" th:text="${error}"></div>

                    <form th:action="@{/offres/creer}" method="post">

                        <div class="mb-6">
                            <label for="idDemande" class="block text-sm font-semibold text-on-surface mb-2">Demande de recrutement liée <span class="text-red-500">*</span></label>
                            <select name="idDemande" id="idDemande" required
                                    class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer">
                                <option value="">-- Sélectionnez une demande --</option>
                                <option th:each="dem : ${demandes}" 
                                        th:value="${dem.idDemandeRecrutement}" 
                                        th:text="${'Demande #' + dem.idDemandeRecrutement + ' - ' + dem.poste.intitule}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-6">
                            <label for="titre" class="block text-sm font-semibold text-on-surface mb-2">Titre de l'offre <span class="text-red-500">*</span></label>
                            <input type="text" name="titre" id="titre" required placeholder="Ex: Développeur Java Senior"
                                   class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                        </div>

                        <div class="mb-8">
                            <label for="description" class="block text-sm font-semibold text-on-surface mb-2">Description <span class="text-red-500">*</span></label>
                            <textarea name="description" id="description" rows="5" required placeholder="Missions, profil recherché..."
                                      class="w-full p-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all"></textarea>
                        </div>

                        <div class="flex items-center justify-end gap-3 pt-6 border-t border-surface-container-high">
                            <a th:href="@{/offres}" class="h-11 px-6 rounded-lg bg-surface-container text-on-surface hover:bg-surface-container-high font-medium text-sm transition-colors border border-surface-container-high flex items-center">
                                Annuler
                            </a>
                            <button type="submit" class="h-11 px-6 rounded-lg bg-primary text-on-primary hover:bg-primary-container font-medium text-sm transition-colors shadow-sm">
                                Enregistrer en brouillon
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>

    </main>
</body>
</html>
