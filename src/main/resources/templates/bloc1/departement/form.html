<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${departement.idDepartement == null ? 'SIRH - Nouveau Département' : 'SIRH - Modifier Département'}"></title>
    
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading">SIRH <span class="text-yellow">Pro</span></div>
            <div class="list-group list-group-flush mt-3">
                <a th:href="@{/dashboard}" class="list-group-item list-group-item-action">Tableau de bord</a>
                <a th:href="@{/demandes}" class="list-group-item list-group-item-action">Demandes de recrutement</a>
                <a th:href="@{/departements}" class="list-group-item list-group-item-action active">Départements</a>
            </div>
        </div>

        <div id="page-content-wrapper" class="w-100 bg-light">
            <div class="container-fluid px-4 py-4">
                
                <div class="mb-4">
                    <a th:href="@{/departements}" class="text-decoration-none text-muted mb-2 d-inline-block">
                        &larr; Retour à la liste
                    </a>
                    <h2 class="fw-bold m-0" th:text="${departement.idDepartement == null ? 'Nouveau Département' : 'Modifier le Département'}"></h2>
                </div>

                <div class="row">
                    <div class="col-lg-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4">
                                
                                <!-- Message d'erreur serveur -->
                                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                                <!-- Formulaire avec gestion du PUT via _method -->
                                <form th:action="${departement.idDepartement == null} ? @{/departements} : @{/departements/{id}(id=${departement.idDepartement})}" 
                                      method="post" 
                                      id="departementForm"
                                      novalidate>
                                    
                                    <!-- Champ caché pour simuler le PUT -->
                                    <input type="hidden" name="_method" value="put" th:if="${departement.idDepartement != null}">

                                    <!-- Titre -->
                                    <div class="mb-4">
                                        <label for="titre" class="form-label fw-medium">Titre du département <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="titre" name="titre" 
                                               th:value="${departement.titre}" required>
                                        <div class="invalid-feedback" id="titreError">
                                            Veuillez saisir un titre unique.
                                        </div>
                                    </div>

                                    <!-- Manager -->
                                    <div class="mb-4">
                                        <label for="idManager" class="form-label fw-medium">Manager assigné</label>
                                        <select class="form-select" id="idManager" name="idManager">
                                            <option value="">— Aucun —</option>
                                            <option th:each="manager : ${managers}" 
                                                    th:value="${manager.idUtilisateur}" 
                                                    th:text="${manager.nom}"
                                                    th:selected="${departement.manager != null and departement.manager.idUtilisateur == manager.idUtilisateur}">
                                            </option>
                                        </select>
                                    </div>

                                    <div class="d-flex justify-content-end gap-2">
                                        <a th:href="@{/departements}" class="btn btn-light border">Annuler</a>
                                        <button type="submit" class="btn btn-primary px-4" id="btnSubmit">Enregistrer</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

    <!-- SCRIPT DE VALIDATION JAVASCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById('departementForm');
            const titreInput = document.getElementById('titre');
            const titreError = document.getElementById('titreError');
            const btnSubmit = document.getElementById('btnSubmit');
            
            // ID du département actuel (null si création)
            const currentId = /*[[${departement.idDepartement}]]*/ null;

            form.addEventListener('submit', function (event) {
                event.preventDefault(); // On bloque l'envoi classique
                event.stopPropagation();

                const titreValue = titreInput.value.trim();

                // 1. Validation basique (champ vide)
                if (titreValue === "") {
                    titreInput.classList.add('is-invalid');
                    titreError.textContent = "Le titre est obligatoire.";
                    return;
                }

                // 2. Validation asynchrone (unicité en base de données)
                btnSubmit.disabled = true;
                btnSubmit.textContent = "Vérification...";

                let url = '/departements/check-titre?titre=' + encodeURIComponent(titreValue);
                if (currentId) {
                    url += '&idDepartement=' + currentId;
                }

                fetch(url)
                    .then(response => response.json())
                    .then(isUnique => {
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = "Enregistrer";

                        if (isUnique) {
                            // Si c'est unique, on soumet le formulaire manuellement
                            titreInput.classList.remove('is-invalid');
                            form.submit(); 
                        } else {
                            // Si doublon, on affiche l'erreur
                            titreInput.classList.add('is-invalid');
                            titreError.textContent = "Ce titre de département est déjà utilisé.";
                        }
                    })
                    .catch(error => {
                        console.error("Erreur lors de la vérification:", error);
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = "Enregistrer";
                        // En cas d'erreur réseau, on laisse le serveur faire la validation finale
                        form.submit();
                    });
            });

            // Nettoyer l'erreur quand l'utilisateur tape
            titreInput.addEventListener('input', function() {
                titreInput.classList.remove('is-invalid');
            });
        });
    </script>
</body>
</html>
