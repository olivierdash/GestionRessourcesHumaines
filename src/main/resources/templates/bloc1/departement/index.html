<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRH - Départements</title>
    
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar 
        <div class="sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading">SIRH <span class="text-yellow">Pro</span></div>
            <div class="list-group list-group-flush mt-3">
                <a th:href="@{/dashboard}" class="list-group-item list-group-item-action">
                    <i class="bi bi-grid-1x2-fill"></i> Tableau de bord
                </a>
                <a th:href="@{/demandes}" class="list-group-item list-group-item-action">
                    <i class="bi bi-folder2-open"></i> Demandes de recrutement
                </a>
                <a th:href="@{/employes}" class="list-group-item list-group-item-action">
                    <i class="bi bi-people-fill"></i> Employés
                </a>
                <a th:href="@{/departements}" class="list-group-item list-group-item-action active">
                    <i class="bi bi-building"></i> Départements
                </a>
            </div>
        </div>-->
        <div th:replace="~{components/sidebar :: sidebar('departements')}" ></div>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100 bg-light">
            <!-- Topbar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 shadow-sm">
                <button class="btn btn-link text-dark d-lg-none" id="menu-toggle">☰</button>
                <div class="collapse navbar-collapse">
                    <div class="d-flex align-items-center ms-auto">
                        <div class="user-profile d-flex align-items-center">
                            <div class="avatar bg-primary text-white me-2">M</div>
                            <div>
                                <span class="d-block fw-bold fs-6">Manager</span>
                                <span class="d-block text-muted fs-7">Rôle: MANAGER</span>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid px-4 py-4">
                
                <!-- En-tête -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold m-0">Départements</h2>
                        <p class="text-muted m-0">Gérez la structure de l'entreprise.</p>
                    </div>
                    <a th:href="@{/departements/create}" class="btn btn-primary">+ Nouveau Département</a>
                </div>

                <!-- Tableau -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 40%;">Nom du département</th>
                                    <th style="width: 30%;">Manager</th>
                                    <th style="width: 30%;" class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Si la liste est vide -->
                                <tr th:if="${#lists.isEmpty(departements)}">
                                    <td colspan="4" class="text-center py-5 text-muted">
                                        <div class="mb-3" style="font-size: 2rem;">🏢</div>
                                        Aucun département n'a été créé pour le moment.
                                    </td>
                                </tr>

                                <!-- Boucle sur les départements -->
                                <tr th:each="dept : ${departements}">                                    
                                    <td class="fw-medium fs-5 text-dark" th:text="${dept.titre}">
                                        Ressources Humaines
                                    </td>
                                    
                                    <td>
                                        <!-- Affichage du Manager (avec gestion si null) -->
                                        <div th:if="${dept.manager != null}" class="d-flex align-items-center">
                                            <div class="avatar bg-secondary text-white me-2" style="width: 28px; height: 28px; font-size: 0.75rem;">
                                                <span th:text="${#strings.substring(dept.manager.nom, 0, 1)}">J</span>
                                            </div>
                                            <span th:text="${dept.manager.nom}">Jean Dupont</span>
                                        </div>
                                        <span th:if="${dept.manager == null}" class="badge bg-light text-muted border">
                                            Non assigné
                                        </span>
                                    </td>
                                    
                                    <td class="text-end">
                                        <a th:href="@{/departements/{id}(id=${dept.idDepartement})}" 
                                           class="btn btn-sm btn-outline-secondary me-1" title="Voir la fiche">
                                            👁️
                                        </a>
                                        <a th:href="@{/departements/{id}/edit(id=${dept.idDepartement})}" 
                                           class="btn btn-sm btn-outline-primary" title="Modifier">
                                            ✏️ Modifier
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
