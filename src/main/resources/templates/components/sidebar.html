<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Déclaration du fragment nommé "sidebar" -->
    <div class="sidebar" id="sidebar-wrapper" th:fragment="sidebar(activePage)">
        <div class="sidebar-heading">SIRH <span class="text-yellow">Pro</span></div>
        <div class="list-group list-group-flush mt-3">
            
            <!-- Remarque le th:classappend : il ajoute la classe 'active' si activePage correspond -->
            <a th:href="@{/utilisateur/dashboard}" class="list-group-item list-group-item-action" 
               th:classappend="${activePage == 'dashboard'} ? 'active'">
               Tableau de bord
            </a>
            
            <a th:href="@{/demandes}" class="list-group-item list-group-item-action" 
               th:classappend="${activePage == 'demandes'} ? 'active'">
               Demandes de recrutement
            </a>
            
            <a th:href="@{/bloc2/offres}" class="list-group-item list-group-item-action" 
               th:classappend="${activePage == 'offres'} ? 'active'">
               Offres d'emploi
            </a>
            
            <a th:href="@{/employes}" class="list-group-item list-group-item-action" 
               th:classappend="${activePage == 'employes'} ? 'active'">
               Employés
            </a>
            
            <a th:href="@{/departements}" class="list-group-item list-group-item-action" 
               th:classappend="${activePage == 'departements'} ? 'active'">
               Départements
            </a>
            
        </div>
    </div>

</body>
</html>
