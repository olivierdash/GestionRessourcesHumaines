<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SIRH - Évaluation</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading">SIRH <span class="text-yellow">Pro</span></div>
            <div class="list-group list-group-flush mt-3">
                <a th:href="@{/dashboard}" class="list-group-item list-group-item-action">Tableau de bord</a>
                <a th:href="@{/demandes}" class="list-group-item list-group-item-action">Demandes de recrutement</a>
                <a th:href="@{/bloc2/offres}" class="list-group-item list-group-item-action active">Offres d'emploi</a>
                <a th:href="@{/employes}" class="list-group-item list-group-item-action">Employés</a>
                <a th:href="@{/departements}" class="list-group-item list-group-item-action">Départements</a>
            </div>
        </div>

        <div id="page-content-wrapper" class="w-100 bg-light">
            <div class="container-fluid px-4 py-4">
                <div class="mb-4">
                    <a th:href="@{/bloc2/offres}" class="text-decoration-none text-muted mb-2 d-inline-block">&larr; Retour aux offres</a>
                    <h2 class="fw-bold m-0">Évaluation du candidat</h2>
                    <p class="text-muted">Candidat : <span class="fw-bold text-primary" th:text="${candidature.candidat.prenom + ' ' + candidature.candidat.nom}"></span></p>
                </div>

                <!-- Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <div class="row g-4">
                    <!-- Historique -->
                    <div class="col-lg-7">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white py-3">
                                <h5 class="m-0 fw-bold">Parcours d'évaluation</h5>
                            </div>
                            <div class="card-body p-0">
                                <table class="table table-hover mb-0 align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th class="ps-4">Type</th>
                                            <th>Note</th>
                                            <th>Commentaire</th>
                                            <th>Date</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="eval : ${evaluations}">
                                            <td class="ps-4 fw-medium" th:text="${eval.typeEvaluation.libelle}"></td>
                                            <td>
                                                <span th:if="${eval.note != null && eval.note >= 10}" class="badge bg-success" th:text="${eval.note} + '/20'"></span>
                                                <span th:if="${eval.note != null && eval.note < 10}" class="badge bg-danger" th:text="${eval.note} + '/20'"></span>
                                                <span th:if="${eval.note == null}" class="text-muted">N/A</span>
                                            </td>
                                            <td class="text-muted small" th:text="${eval.evaluation}"></td>
                                            <td class="text-muted" th:text="${#temporals.format(eval.dateEvaluation, 'dd/MM/yyyy')}"></td>
                                        </tr>
                                        <tr th:if="${evaluations.isEmpty()}">
                                            <td colspan="4" class="text-center py-4 text-muted">Aucune évaluation pour le moment.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Formulaire -->
                    <div class="col-lg-5">
                        <div class="card shadow-sm border-0 border-top border-4 border-primary">
                            <div class="card-body p-4">
                                <h5 class="fw-bold mb-3">Ajouter une évaluation</h5>
                                <form th:action="@{/bloc2/candidatures/{id}/evaluer(id=${candidature.idCandidature})}" method="post">
                                    
                                    <div class="mb-3">
                                        <label for="idTypeEvaluation" class="form-label fw-medium">Type d'évaluation <span class="text-danger">*</span></label>
                                        <select name="idTypeEvaluation" id="idTypeEvaluation" class="form-select" required>
                                            <option value="">-- Choisissez un type --</option>
                                            <option th:each="type : ${typesEvaluation}" th:value="${type.id}" th:text="${type.libelle}"></option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label for="note" class="form-label fw-medium">Note (sur 20)</label>
                                        <input type="number" name="note" id="note" class="form-control" step="0.5" min="0" max="20" placeholder="Ex: 15.5">
                                    </div>

                                    <div class="mb-4">
                                        <label for="commentaire" class="form-label fw-medium">Compte-rendu <span class="text-danger">*</span></label>
                                        <textarea name="commentaire" id="commentaire" class="form-control" rows="4" required placeholder="Points forts, points faibles, décision..."></textarea>
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100">Enregistrer l'évaluation</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
