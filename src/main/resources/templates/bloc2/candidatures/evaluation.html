<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Évaluation du candidat</title>
    <style>table, th, td { border: 1px solid #333; border-collapse: collapse; padding: 8px; } th { background-color: #f2f2f2; }</style>
</head>
<body>
    <h2>Évaluer le candidat : <span th:text="${candidature.candidat.nom + ' ' + candidature.candidat.prenom}"></span></h2>

    <div th:if="${success}" style="color: green; font-weight: bold; margin-bottom: 10px;" th:text="${success}"></div>
    <div th:if="${error}" style="color: red; font-weight: bold; margin-bottom: 10px;" th:text="${error}"></div>

    <h3>Historique du parcours d'évaluation</h3>
    <table>
        <thead>
            <tr>
                <th>Type d'évaluation</th>
                <th>Note</th>
                <th>Compte-rendu</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="eval : ${evaluations}">
                <td th:text="${eval.typeEvaluation.libelle}"></td>
                <td th:text="${eval.note != null ? eval.note + ' / 20' : 'N/A'}" 
                    th:style="${eval.note != null && eval.note >= 10 ? 'color: green; font-weight:bold;' : 'color: red;'}"></td>
                <td th:text="${eval.evaluation}"></td>
                <td th:text="${eval.dateEvaluation}"></td>
            </tr>
            <tr th:if="${evaluations.isEmpty()}">
                <td colspan="4" style="text-align:center; color: gray;">Aucune évaluation pour le moment.</td>
            </tr>
        </tbody>
    </table>

    <hr style="margin: 20px 0;">
    
    <h3>Ajouter une nouvelle évaluation</h3>
    <form th:action="@{/bloc2/candidatures/{id}/evaluer(id=${candidature.idCandidature})}" method="post">
        <label for="idTypeEvaluation">Type de l'évaluation :</label><br>
        <select name="idTypeEvaluation" id="idTypeEvaluation" required>
            <option value="">-- Choisissez un type --</option>
            <option th:each="type : ${typesEvaluation}" 
                    th:value="${type.id}" 
                    th:text="${type.libelle}"></option>
        </select><br><br>

        <label for="note">Note (sur 20) :</label><br>
        <input type="number" name="note" id="note" step="0.5" min="0" max="20"><br><br>

        <label for="commentaire">Commentaire / Compte-rendu :</label><br>
        <textarea name="commentaire" id="commentaire" rows="4" cols="50" required placeholder="Points forts, points faibles, décision..."></textarea><br><br>

        <button type="submit">Enregistrer l'évaluation</button>
    </form>
    
    <br>
    <a th:href="@{/bloc2/offres}">← Retour aux offres</a>
</body>
</html>
