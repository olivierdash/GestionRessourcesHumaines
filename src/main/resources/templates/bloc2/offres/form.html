<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Créer une offre</title>
</head>
<body>
    <h2>Créer une nouvelle offre</h2>
    
    <div th:if="${error}" style="color: red; font-weight: bold; margin-bottom: 10px;" th:text="${error}"></div>

    <form th:action="@{/bloc2/offres/creer}" method="post">
        <label for="idDemande">Demande de recrutement liée :</label><br>
        <select name="idDemande" id="idDemande" required>
            <option value="">-- Sélectionnez une demande --</option>
            <option th:each="dem : ${demandes}" 
                    th:value="${dem.idDemandeRecrutement}" 
                    th:text="${'Demande #' + dem.idDemandeRecrutement + ' - ' + dem.poste.intitule}">
            </option>
        </select><br><br>
        
        <label for="titre">Titre de l'offre :</label><br>
        <input type="text" name="titre" id="titre" required size="50" placeholder="Ex: Développeur Java Senior"><br><br>
        
        <label for="description">Description :</label><br>
        <textarea name="description" id="description" rows="5" cols="50" required placeholder="Missions, profil recherché..."></textarea><br><br>
        
        <button type="submit">Enregistrer en brouillon</button>
    </form>
    
    <br>
    <a th:href="@{/bloc2/offres}">← Retour à la liste</a>
</body>
</html>
