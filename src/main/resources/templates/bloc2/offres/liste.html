<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Offres d'emploi</title>
    <style>table, th, td { border: 1px solid #333; border-collapse: collapse; padding: 8px; } th { background-color: #f2f2f2; }</style>
</head>
<body>
    <h2>Liste des offres d'emploi</h2>
    
    <!-- Messages de succès ou d'erreur -->
    <div th:if="${success}" style="color: green; font-weight: bold; margin-bottom: 10px;" th:text="${success}"></div>
    <div th:if="${error}" style="color: red; font-weight: bold; margin-bottom: 10px;" th:text="${error}"></div>

    <a th:href="@{/bloc2/offres/creer}" style="display:inline-block; margin-bottom: 15px;">➕ Créer une nouvelle offre</a>
    <br>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Titre</th>
                <th>Statut</th>
                <th>Date de publication</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="offre : ${offres}">
                <td th:text="${offre.idOffre}"></td>
                <td th:text="${offre.titre}"></td>
                <td>
                    <span th:text="${offre.statut.libelle}" 
                          th:style="${offre.statut.id == 1 ? 'color: orange;' : 'color: green;'}"></span>
                </td>
                <td th:text="${offre.datePublication != null ? offre.datePublication : 'En attente'}"></td>
                <td>
                    <!-- Bouton Publier (uniquement si statut = BROUILLON / ID 1) -->
                    <form th:if="${offre.statut.id == 1}" 
                          th:action="@{/bloc2/offres/{id}/publier(id=${offre.idOffre})}" 
                          method="post" style="display:inline;">
                        <button type="submit">Publier</button>
                    </form>
                    
                    <!-- Lien vers les candidatures -->
                    <a th:href="@{/bloc2/offres/{id}/candidatures(id=${offre.idOffre})}" style="margin-left: 10px;">Voir Candidatures</a>
                </td>
            </tr>
            <tr th:if="${offres.isEmpty()}">
                <td colspan="5" style="text-align:center;">Aucune offre disponible.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
