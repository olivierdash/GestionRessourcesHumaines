<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SIRH - Fiche Candidat</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar 
        <div class="sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading">SIRH <span class="text-yellow">Pro</span></div>
            <div class="list-group list-group-flush mt-3">
                <a th:href="@{/dashboard}" class="list-group-item list-group-item-action">Tableau de bord</a>
                <a th:href="@{/demandes}" class="list-group-item list-group-item-action">Demandes de recrutement</a>
                <a th:href="@{/bloc2/offres}" class="list-group-item list-group-item-action active">Offres d'emploi</a>
                <a th:href="@{/employes}" class="list-group-item list-group-item-action">Employés</a>
                <a th:href="@{/departements}" class="list-group-item list-group-item-action">Départements</a>
            </div>
        </div>-->
        <div th:replace="~{components/sidebar :: sidebar('offres')}" ></div>
        
        <div id="page-content-wrapper" class="w-100 bg-light">
            <div class="container-fluid px-4 py-4">
                <div class="mb-4">
                    <a th:href="@{/bloc2/offres}" class="text-decoration-none text-muted mb-2 d-inline-block">&larr; Retour aux offres</a>
                    <h2 class="fw-bold m-0">Fiche Candidat</h2>
                </div>

                <div class="row g-4">
                    <!-- Colonne Infos -->
                    <div class="col-md-5 col-lg-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body text-center py-5">
                                <div class="avatar bg-primary text-white mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                    <span th:text="${#strings.substring(candidat.prenom, 0, 1) + #strings.substring(candidat.nom, 0, 1)}">JD</span>
                                </div>
                                <h4 class="fw-bold mb-1" th:text="${candidat.prenom + ' ' + candidat.nom}"></h4>
                                <p class="text-muted mb-4" th:text="${candidat.email}"></p>
                                
                                <div class="text-start mt-4 border-top pt-3">
                                    <p class="mb-2"><strong>Téléphone :</strong> <span th:text="${candidat.telephone}"></span></p>
                                    <p class="mb-0"><strong>CV :</strong> <a th:href="${candidat.cvUrl}" target="_blank" class="text-decoration-none">Télécharger le PDF</a></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Colonne Historique -->
                    <div class="col-md-7 col-lg-8">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white py-3">
                                <h5 class="m-0 fw-bold">Historique des candidatures</h5>
                            </div>
                            <div class="card-body p-0">
                                <table class="table table-hover mb-0 align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th class="ps-4">Offre</th>
                                            <th>Date</th>
                                            <th>Statut</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="cand : ${candidatures}">
                                            <td class="ps-4 fw-medium" th:text="${cand.offre.titre}"></td>
                                            <td class="text-muted" th:text="${#temporals.format(cand.dateDepotCandidature, 'dd/MM/yyyy')}"></td>
                                            <td>
                                                <span th:if="${cand.statutCandidature.id == 1}" class="badge bg-secondary">REÇU</span>
                                                <span th:if="${cand.statutCandidature.id == 2}" class="badge bg-warning text-dark">EN ÉVALUATION</span>
                                                <span th:if="${cand.statutCandidature.id == 3}" class="badge bg-success">RETENU</span>
                                                <span th:if="${cand.statutCandidature.id == 4}" class="badge bg-danger">REFUSÉ</span>
                                            </td>
                                        </tr>
                                        <tr th:if="${candidatures.isEmpty()}">
                                            <td colspan="3" class="text-center py-4 text-muted">Aucune candidature enregistrée.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
