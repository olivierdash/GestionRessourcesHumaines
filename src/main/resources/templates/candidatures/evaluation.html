<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div>
            <a th:href="@{/offres}" class="inline-flex items-center gap-1 text-sm text-on-surface-variant hover:text-primary transition-colors mb-2">
                &larr; Retour aux offres
            </a>
            <h2 class="font-headline-xl text-headline-xl text-on-surface font-bold">
                Évaluer le candidat : <span class="text-primary" th:text="${candidature.candidat.nom + ' ' + candidature.candidat.prenom}"></span>
            </h2>
        </div>

        <!-- Messages d'alerte -->
        <div th:if="${success}" class="p-4 rounded-lg bg-green-50 text-green-700 border border-green-200 text-sm font-medium" th:text="${success}"></div>
        <div th:if="${error}" class="p-4 rounded-lg bg-red-50 text-red-600 border border-red-200 text-sm font-medium" th:text="${error}"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- Historique des évaluations (Colonne de gauche) -->
            <div class="lg:col-span-7">
                <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high h-full flex flex-col overflow-hidden">
                    <div class="p-6 border-b border-surface-container-high bg-surface-container-low/30">
                        <h3 class="font-title-sm text-title-sm text-on-surface font-semibold">Historique du parcours d'évaluation</h3>
                    </div>
                    <div class="overflow-x-auto flex-grow">
                        <table class="sirh-table">
                            <thead>
                                <tr>
                                    <th scope="col">Type d'évaluation</th>
                                    <th scope="col">Note</th>
                                    <th scope="col">Compte-rendu</th>
                                    <th scope="col">Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="eval : ${evaluations}">
                                    <td class="font-medium text-on-surface" th:text="${eval.typeEvaluation.libelle}"></td>
                                    <td>
                                        <span th:text="${eval.note != null ? eval.note + ' / 20' : 'N/A'}" 
                                              th:classappend="${eval.note == null ? 'text-outline' : (eval.note >= 10 ? 'text-green-600 font-bold' : 'text-red-600 font-bold')}">
                                        </span>
                                    </td>
                                    <td class="text-on-surface-variant" th:text="${eval.evaluation}"></td>
                                    <td class="text-outline whitespace-nowrap" th:text="${#temporals.format(eval.dateEvaluation, 'dd/MM/yyyy HH:mm')}"></td>
                                </tr>
                                <tr th:if="${evaluations.isEmpty()}">
                                    <td colspan="4" class="td-empty">
                                        Aucune évaluation pour le moment.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Formulaire d'ajout (Colonne de droite) -->
            <div class="lg:col-span-5">
                <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high h-full flex flex-col overflow-hidden">
                    <div class="p-6 border-b border-surface-container-high bg-surface-container-low/30">
                        <h3 class="font-title-sm text-title-sm text-on-surface font-semibold">Ajouter une nouvelle évaluation</h3>
                    </div>
                    <div class="p-6 flex-grow">
                        <form th:action="@{/candidatures/{id}/evaluer(id=${candidature.idCandidature})}" method="post" class="flex flex-col gap-5 h-full">

                            <div>
                                <label for="idTypeEvaluation" class="block text-sm font-semibold text-on-surface mb-2">Type de l'évaluation <span class="text-red-500">*</span></label>
                                <select name="idTypeEvaluation" id="idTypeEvaluation" required
                                        class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer">
                                    <option value="">-- Choisissez un type --</option>
                                    <option th:each="type : ${typesEvaluation}" 
                                            th:value="${type.id}" 
                                            th:text="${type.libelle}"></option>
                                </select>
                            </div>

                            <div>
                                <label for="note" class="block text-sm font-semibold text-on-surface mb-2">Note (sur 20)</label>
                                <input type="number" name="note" id="note" step="0.5" min="0" max="20" placeholder="Ex: 15"
                                       class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                            </div>

                            <div class="flex-grow flex flex-col">
                                <label for="commentaire" class="block text-sm font-semibold text-on-surface mb-2">Commentaire / Compte-rendu <span class="text-red-500">*</span></label>
                                <textarea name="commentaire" id="commentaire" required placeholder="Points forts, points faibles, décision..."
                                          class="w-full flex-grow p-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all min-h-[120px]"></textarea>
                            </div>

                            <div class="pt-4 border-t border-surface-container-high">
                                <button type="submit" class="w-full h-11 px-6 rounded-lg bg-primary text-on-primary hover:bg-primary-container font-medium text-sm transition-colors shadow-sm">
                                    Enregistrer l'évaluation
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>
</body>
</html>
