<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-2xl mx-auto flex flex-col gap-6 w-full">

        <div>
            <h1 class="font-headline-xl text-headline-xl text-on-surface font-bold">Proposer un poste</h1>
        </div>

        <div th:if="${erreur}" class="p-4 rounded-lg bg-red-50 text-red-600 border border-red-200 text-sm font-medium" th:text="${erreur}"></div>

        <!-- Carte d'infos -->
        <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
            <div class="p-6 md:p-8 flex flex-col gap-2">
                <p class="m-0"><strong class="text-on-surface">Candidat :</strong>
                    <span class="text-on-surface-variant" th:text="${candidature.candidat.prenom + ' ' + candidature.candidat.nom}"></span></p>
                <p class="m-0"><strong class="text-on-surface">Poste :</strong>
                    <span class="text-on-surface-variant" th:text="${candidature.demandeRecrutement.poste.intitule}"></span></p>
                <p class="m-0"><strong class="text-on-surface">Statut de la candidature :</strong>
                    <span class="inline-flex px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold" th:text="${candidature.statutCandidature.libelle}"></span></p>
            </div>
        </div>

        <!-- Formulaire -->
        <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
            <div class="p-6 md:p-8">
                <form th:action="@{/candidatures/{id}/proposer(id=${candidature.idCandidature})}" method="post" class="flex flex-col gap-6">
                    
                    <div>
                        <label for="salaire" class="block text-sm font-semibold text-on-surface mb-2">Salaire mensuel proposé</label>
                        <input type="number" step="0.01" min="0" id="salaire" name="salaire" required
                               class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                    </div>
                    
                    <div>
                        <label for="joursValidite" class="block text-sm font-semibold text-on-surface mb-2">Validité de la proposition (jours)</label>
                        <input type="number" min="1" value="7" id="joursValidite" name="joursValidite" required
                               class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                    </div>

                    <div class="flex items-center gap-3 pt-4 border-t border-surface-container-high">
                        <button type="submit" class="h-11 px-6 rounded-lg bg-primary text-on-primary hover:bg-primary-container font-medium text-sm transition-colors shadow-sm">
                            Créer la proposition
                        </button>
                        <a th:href="@{/propositions}" class="h-11 px-6 rounded-lg bg-surface-container text-on-surface hover:bg-surface-container-high border border-surface-container-high font-medium text-sm transition-colors flex items-center">
                            Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>

    </main>
</body>
</html>
