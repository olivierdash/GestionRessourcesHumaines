<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRH - Détails de l'Employé</title>
    
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading">SIRH <span class="text-yellow">Pro</span></div>
            <div class="list-group list-group-flush mt-3">
                <a th:href="@{/dashboard}" class="list-group-item list-group-item-action">Tableau de bord</a>
                <a th:href="@{/demandes}" class="list-group-item list-group-item-action">Demandes de recrutement</a>
                <a th:href="@{/employes}" class="list-group-item list-group-item-action active">Employés</a>
                <a th:href="@{/departements}" class="list-group-item list-group-item-action">Départements</a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100 bg-light">
            <!-- Topbar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 shadow-sm">
                <div class="collapse navbar-collapse">
                    <div class="d-flex align-items-center ms-auto">
                        <div class="user-profile d-flex align-items-center">
                            <div class="avatar bg-primary text-white me-2">M</div>
                            <div>
                                <span class="d-block fw-bold fs-6">Manager</span>
                                <span class="d-block text-muted fs-7">Rôle: MANAGER</span>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>

            <div class="container-fluid px-4 py-4">
                
                <!-- En-tête de la page -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <a th:href="@{/employes}" class="text-decoration-none text-muted mb-2 d-inline-block">
                            &larr; Retour à la liste
                        </a>
                        <h2 class="fw-bold m-0 d-flex align-items-center">
                            Fiche Employé
                            <span class="badge bg-primary ms-3 fs-6 rounded-pill" 
                                  th:text="'#' + ${employe.idEmployer}">
                                #123
                            </span>
                        </h2>
                    </div>
                </div>

                <!-- Contenu principal -->
                <div class="row g-4">
                    
                    <!-- Colonne de gauche (Infos principales) -->
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white py-3">
                                <h5 class="m-0 fw-bold text-primary">Informations professionnelles</h5>
                            </div>
                            <div class="card-body">
                                
                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3">
                                        <span class="text-muted d-block fs-7 mb-1">Matricule</span>
                                        <h4 class="fw-bold m-0 font-monospace" th:text="${employe.matricule}">MAT-2024-001</h4>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <span class="text-muted d-block fs-7 mb-1">Date d'embauche</span>
                                        <h5 class="m-0" th:text="${#temporals.format(employe.hiringDate, 'dd MMMM yyyy')}">01 Janvier 2024</h5>
                                    </div>
                                </div>

                                <hr class="text-muted opacity-25">

                                <div class="row mt-4">
                                    <div class="col-md-12">
                                        <span class="text-muted d-block fs-7 mb-2">Statut actuel</span>
                                        
                                        <!-- Badge de statut dynamique -->
                                        <span class="badge fs-6 px-3 py-2" 
                                              th:classappend="${employe.statusEmployer == 'ACTIF' ? 'bg-success' : 
                                                              (employe.statusEmployer == 'SORTI' ? 'bg-danger' : 'bg-secondary')}"
                                              th:text="${employe.statusEmployer}">
                                            ACTIF
                                        </span>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- Colonne de droite (Résumé & Actions) -->
                    <div class="col-lg-4">
                        
                        <!-- Carte Avatar / Profil -->
                        <div class="card shadow-sm border-0 mb-4 text-center py-4">
                            <div class="card-body">
                                <div class="avatar bg-secondary text-white mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                                    <!-- On affiche la première lettre du matricule ou un icône par défaut -->
                                    <span th:text="${#strings.substring(employe.matricule, 0, 1)}">M</span>
                                </div>
                                <h5 class="fw-bold m-0" th:text="${employe.matricule}">MAT-2024-001</h5>
                                <p class="text-muted fs-7 mb-0">Identifiant interne</p>
                            </div>
                        </div>
                        
                        <!-- Actions rapides -->
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h6 class="fw-bold mb-3 text-muted text-uppercase fs-7">Actions rapides</h6>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-outline-primary text-start" disabled>
                                        ✏️ Modifier la fiche
                                    </button>
                                    <button class="btn btn-outline-danger text-start" disabled>
                                        🚫 Marquer comme sorti
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
