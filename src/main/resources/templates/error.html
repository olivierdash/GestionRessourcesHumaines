<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erreur - SIRH Pro</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: "#00236f",
                        "primary-container": "#1e3a8a",
                        background: "#faf8ff",
                        "surface-mid": "#eaedff",
                        "on-surface": "#131b2e",
                        outline: "#757682",
                        secondary: "#4b41e1"
                    }
                }
            }
        }
    </script>
    
    <!-- 2. Ton fichier styles.css -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>

<body class="bg-background h-screen font-sans antialiased text-on-surface overflow-hidden flex items-center justify-center relative">

    <!-- Fond décoratif (Blobs) -->
    <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-blue-200/40 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 left-10 w-80 h-80 rounded-full bg-orange-200/30 blur-3xl pointer-events-none"></div>

    <!-- Contenu principal -->
    <div class="relative z-10 w-full max-w-3xl px-6 py-12 flex flex-col items-center text-center">
        
        <!-- Code HTTP + Illustration -->
        <div class="relative flex items-center justify-center mb-6">
            <!-- Le code d'erreur en très grand (404, 500...) -->
            <span class="text-[120px] leading-none font-bold tracking-tighter text-surface-mid select-none" 
                  th:text="${status != null ? status : '500'}">404</span>
            
            <!-- L'illustration SVG superposée -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <svg class="w-28 h-28 text-primary-container/80 drop-shadow-lg" fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <rect fill="currentColor" fill-opacity="0.08" height="72" rx="10" width="76" x="22" y="24"></rect>
                    <path d="M38 42H82M38 56H68M38 70H54" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
                    <circle cx="74" cy="74" fill="#FFFFFF" r="18"></circle>
                    <circle cx="74" cy="74" r="18" stroke="#ef9900" stroke-width="3.5"></circle>
                    <line stroke="#ef9900" stroke-linecap="round" stroke-width="4" x1="87" x2="102" y1="87" y2="102"></line>
                    <path d="M70 74H78M74 70V78" stroke="#00236f" stroke-linecap="round" stroke-width="2"></path>
                </svg>
            </div>
        </div>

        <!-- Texte dynamique -->
        <h1 class="text-2xl md:text-3xl font-bold text-on-surface mb-3 max-w-2xl" 
            th:text="${error != null ? error : 'Ressource RH introuvable'}">
            Ressource RH introuvable
        </h1>
        
        <p class="text-base text-outline mb-8 max-w-lg leading-relaxed" 
           th:text="${message != null ? message : 'La fiche collaborateur, le document contractuel ou la demande de recrutement demandée n''existe plus ou a été archivée.'}">
            La fiche collaborateur, le document contractuel ou la demande de recrutement demandée n'existe plus ou a été archivée.
        </p>

        <!-- Bouton -->
        <div class="flex items-center justify-center w-full">
            <button type="button" onclick="window.history.back()" 
                class="inline-flex items-center justify-center gap-2 h-12 px-8 bg-primary-container hover:bg-primary text-white font-semibold text-sm rounded-xl transition-colors shadow-sm">
                <span class="ms text-[20px]">arrow_back</span>
                <span>Page précédente</span>
            </button>
        </div>

    </div>

</body>
</html>
