<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" th:replace="~{dashboard :: layout(content=~{::mainContent})}">

<body>

    <main th:fragment="mainContent" class="app-page">

        <!-- En-tête -->
        <div class="mb-4">
            <a th:href="@{/demandes}" class="back-link">&larr; Retour à la liste</a>
            <h2 class="page-title">Nouvelle demande de recrutement</h2>
            <p class="text-muted text-small mt-1 mb-0">Remplissez les informations ci-dessous pour initier le processus.
            </p>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card-x">
                    <div class="card-pad">

                        <!-- Ajout de la classe needs-validation -->
                        <form th:action="@{/demandes}" method="post" id="demandeForm" class="needs-validation"
                            novalidate>

                            <!-- Manager -->
                            <div class="mb-4">
                                <label for="idManager" class="form-label">Manager demandeur <span
                                        class="text-error">*</span></label>
                                <select class="form-select" id="idManager" name="idManager" required>
                                    <option value="" disabled selected>Sélectionnez un manager...</option>
                                    <option th:each="manager : ${managers}" th:value="${manager.idUtilisateur}"
                                        th:text="${manager.nom + ' (' + manager.role.libelle + ')'}">
                                    </option>
                                </select>
                                <div class="invalid-feedback">Veuillez sélectionner un manager.</div>
                            </div>

                            <!-- Poste (Recherche + Liste Flottante) -->
                            <div class="mb-4">
                                <label for="posteSearch" class="form-label">Poste concerné <span
                                        class="text-error">*</span></label>
                                <div class="custom-select-wrapper">
                                    <input type="text" class="form-control" id="posteSearch"
                                        placeholder="Tapez pour rechercher un poste..." autocomplete="off" required>
                                    <div class="custom-dropdown" id="posteDropdown"></div>
                                    <!-- Le select caché n'a pas besoin d'être requis côté HTML car le JS gère -->
                                    <select class="d-none" id="posteSelect" name="idPoste" required>
                                        <option value=""></option>
                                        <option th:each="poste : ${postes}" th:value="${poste.idPoste}"
                                            th:text="${poste.intitule + ' - ' + poste.departement.titre}">
                                        </option>
                                    </select>
                                </div>
                                <div class="invalid-feedback" id="posteError">Veuillez sélectionner un poste dans la
                                    liste.</div>
                            </div>

                            <div class="row g-4 mb-4">
                                <div class="col-md-6">
                                    <label for="dateSouhaitee" class="form-label">Date d'entrée souhaitée <span
                                            class="text-error">*</span></label>
                                    <input type="date" class="form-control" id="dateSouhaitee" name="dateSouhaitee"
                                        required>
                                    <div class="invalid-feedback">Veuillez choisir une date.</div>
                                </div>

                                <div class="col-md-6">
                                    <label for="effectif" class="form-label">Effectif requis <span
                                            class="text-error">*</span></label>
                                    <input type="number" class="form-control" id="effectif" name="effectif" min="1"
                                        step="1" required placeholder="Ex: 2">
                                    <div class="invalid-feedback">L'effectif doit être supérieur à 0.</div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="motif" class="form-label">Motif de la demande</label>
                                <!-- Le textarea sera corrigé via le CSS -->
                                <textarea class="form-control" id="motif" name="motif" rows="4"
                                    placeholder="Expliquez brièvement la raison de ce recrutement..."></textarea>
                            </div>

                            <!-- Actions -->
                            <div class="form-actions">
                                <a th:href="@{/demandes}" class="btn-soft">Annuler</a>
                                <button type="submit" class="btn-brand">Créer la demande</button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>

        <!-- SCRIPT UNIFIÉ ET FACTORISÉ POUR LA PAGE -->
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // 1. Récupération des éléments du DOM
                const form = document.getElementById('demandeForm');
                const searchInput = document.getElementById('posteSearch');
                const hiddenSelect = document.getElementById('posteSelect');
                const dropdown = document.getElementById('posteDropdown');

                // 2. Fonctions utilitaires (Logique métier)

                function initDropdown() {
                    // Génère les divs personnalisés à partir du select caché
                    const options = Array.from(hiddenSelect.options).filter(opt => opt.value !== "");

                    options.forEach(opt => {
                        const div = document.createElement('div');
                        div.className = 'custom-option';
                        div.textContent = opt.text;
                        div.dataset.value = opt.value;

                        // Au clic sur une option, on la sélectionne
                        div.addEventListener('click', () => selectOption(opt, div));
                        dropdown.appendChild(div);
                    });
                }

                function selectOption(opt, divElement) {
                    searchInput.value = opt.text;
                    hiddenSelect.value = opt.value;
                    searchInput.classList.remove('is-invalid');
                    closeDropdown();
                }

                function filterList() {
                    const query = searchInput.value.toLowerCase();
                    const items = dropdown.querySelectorAll('.custom-option:not(.no-result)');
                    let hasVisible = false;

                    items.forEach(item => {
                        if (item.textContent.toLowerCase().includes(query)) {
                            item.style.display = 'block';
                            hasVisible = true;
                        } else {
                            item.style.display = 'none';
                        }
                    });

                    toggleNoResultMessage(!hasVisible);
                }

                function toggleNoResultMessage(show) {
                    let noResultDiv = dropdown.querySelector('.no-result');

                    if (show) {
                        if (!noResultDiv) {
                            noResultDiv = document.createElement('div');
                            noResultDiv.className = 'custom-option no-result';
                            noResultDiv.textContent = 'Aucun poste trouvé';
                            dropdown.appendChild(noResultDiv);
                        }
                        noResultDiv.style.display = 'block';
                    } else if (noResultDiv) {
                        noResultDiv.style.display = 'none';
                    }
                }

                function openDropdown() {
                    dropdown.classList.add('show');
                    filterList(); // Applique le filtre à l'ouverture
                }

                function closeDropdown() {
                    dropdown.classList.remove('show');
                }

                function isFormValid() {
                    // Vérification personnalisée : un poste a-t-il été sélectionné ?
                    if (hiddenSelect.value === "") {
                        searchInput.classList.add('is-invalid');
                        return false;
                    } else {
                        searchInput.classList.remove('is-invalid');
                    }

                    // Vérification HTML5 standard (champs required, types email, etc.)
                    return form.checkValidity();
                }

                // 3. Attachement des événements (Listeners)

                searchInput.addEventListener('focus', openDropdown);

                searchInput.addEventListener('input', () => {
                    hiddenSelect.value = ""; // Réinitialise la sélection cachée lors de la saisie
                    openDropdown();
                });

                // Fermer le dropdown si on clique n'importe où ailleurs sur la page
                document.addEventListener('click', (e) => {
                    if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                        closeDropdown();
                        // Si on quitte le champ alors qu'il est vide, on affiche l'erreur
                        if (hiddenSelect.value === "") {
                            searchInput.classList.add('is-invalid');
                        }
                    }
                });

                form.addEventListener('submit', function (e) {
                    if (!isFormValid()) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    form.classList.add('was-validated');
                });

                // 4. Initialisation au chargement de la page
                initDropdown();
            });
        </script>

    </main>
</body>

</html>
