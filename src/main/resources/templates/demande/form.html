<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{dashboard :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="app-page">

        <!-- En-tête -->
        <div class="mb-4">
            <a th:href="@{/demandes}" class="back-link">&larr; Retour à la liste</a>
            <h2 class="page-title">Nouvelle demande de recrutement</h2>
            <p class="text-outline mt-1 mb-0">Remplissez les informations ci-dessous pour initier le processus.</p>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div class="card-x">
                    <div class="p-4">

                        <form th:action="@{/demandes}" method="post" id="demandeForm">

                            <!-- Manager -->
                            <div class="mb-4">
                                <label for="idManager" class="form-label">Manager demandeur <span class="req">*</span></label>
                                <select class="form-select" id="idManager" name="idManager" required>
                                    <option value="" disabled selected>Sélectionnez un manager...</option>
                                    <option th:each="manager : ${managers}" 
                                            th:value="${manager.idUtilisateur}" 
                                            th:text="${manager.nom + ' (' + manager.role.libelle + ')'}">
                                    </option>
                                </select>
                                <div class="invalid-feedback">Veuillez sélectionner un manager.</div>
                            </div>

                            <!-- Poste (Recherche + Liste Flottante) -->
                            <div class="mb-4">
                                <label for="posteSearch" class="form-label">Poste concerné <span class="req">*</span></label>
                                <div class="custom-select-wrapper">
                                    <!-- Le champ visible -->
                                    <input type="text" class="form-control" id="posteSearch" placeholder="Tapez pour rechercher un poste..." autocomplete="off" required>
                                    
                                    <!-- La liste flottante (générée via JS) -->
                                    <div class="custom-dropdown" id="posteDropdown"></div>
                                    
                                    <!-- Le vrai select caché -->
                                    <select class="d-none" id="posteSelect" name="idPoste" required>
                                        <option value=""></option>
                                        <option th:each="poste : ${postes}" 
                                                th:value="${poste.idPoste}" 
                                                th:text="${poste.intitule + ' - ' + poste.departement.titre}">
                                        </option>
                                    </select>
                                </div>
                                <div class="invalid-feedback" id="posteError">Veuillez sélectionner un poste dans la liste.</div>
                            </div>

                            <div class="row g-4 mb-4">
                                <div class="col-md-6">
                                    <label for="dateSouhaitee" class="form-label">Date d'entrée souhaitée <span class="req">*</span></label>
                                    <input type="date" class="form-control" id="dateSouhaitee" name="dateSouhaitee" required>
                                    <div class="invalid-feedback">Veuillez choisir une date.</div>
                                </div>

                                <div class="col-md-6">
                                    <label for="effectif" class="form-label">Effectif requis <span class="req">*</span></label>
                                    <input type="number" class="form-control" id="effectif" name="effectif" min="1" step="1" required placeholder="Ex: 2">
                                    <div class="invalid-feedback">L'effectif doit être supérieur à 0.</div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="motif" class="form-label">Motif de la demande</label>
                                <textarea class="form-control" id="motif" name="motif" rows="4" placeholder="Expliquez brièvement la raison de ce recrutement..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end align-items-center mt-5 pt-4 border-top" style="border-color: var(--surface-high) !important;">
                                <a th:href="@{/demandes}" class="btn-soft me-3">Annuler</a>
                                <button type="submit" class="btn-brand">Créer la demande</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

        <!-- Script pour la liste flottante -->
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const searchInput = document.getElementById('posteSearch');
                const hiddenSelect = document.getElementById('posteSelect');
                const dropdown = document.getElementById('posteDropdown');
                const form = document.getElementById('demandeForm');

                const options = Array.from(hiddenSelect.options).filter(opt => opt.value !== "");

                options.forEach(opt => {
                    const div = document.createElement('div');
                    div.className = 'custom-option';
                    div.textContent = opt.text;
                    div.dataset.value = opt.value;

                    div.addEventListener('click', () => {
                        searchInput.value = opt.text;
                        hiddenSelect.value = opt.value;
                        dropdown.classList.remove('show');
                        searchInput.classList.remove('is-invalid');
                    });
                    dropdown.appendChild(div);
                });

                searchInput.addEventListener('focus', () => {
                    dropdown.classList.add('show');
                    filterList(); 
                });

                document.addEventListener('click', (e) => {
                    if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                        dropdown.classList.remove('show');
                        validateSelection(); 
                    }
                });

                searchInput.addEventListener('input', () => {
                    hiddenSelect.value = ""; 
                    filterList();
                    dropdown.classList.add('show');
                });

                function filterList() {
                    const filter = searchInput.value.toLowerCase();
                    const items = dropdown.querySelectorAll('.custom-option');
                    let hasVisible = false;

                    items.forEach(item => {
                        if (item.classList.contains('no-result')) return;
                        if (item.textContent.toLowerCase().includes(filter)) {
                            item.style.display = 'block';
                            hasVisible = true;
                        } else {
                            item.style.display = 'none';
                        }
                    });

                    let noResultDiv = dropdown.querySelector('.no-result');
                    if (!hasVisible) {
                        if (!noResultDiv) {
                            noResultDiv = document.createElement('div');
                            noResultDiv.className = 'custom-option no-result';
                            noResultDiv.textContent = 'Aucun poste trouvé';
                            dropdown.appendChild(noResultDiv);
                        }
                        noResultDiv.style.display = 'block';
                    } else if (noResultDiv) {
                        noResultDiv.style.display = 'none';
                    }
                }

                function validateSelection() {
                    if (hiddenSelect.value === "") {
                        searchInput.classList.add('is-invalid');
                        return false;
                    } else {
                        searchInput.classList.remove('is-invalid');
                        return true;
                    }
                }

                form.addEventListener('submit', (e) => {
                    if (!validateSelection()) {
                        e.preventDefault(); 
                    }
                });
            });
        </script>

    </main>
</body>
</html>
