<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="fr" th:fragment="layout(content)">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIRH Pro – Application</title>

    <!-- Fichiers CSS Locaux -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-page"> <!-- Ajout de app-page ici -->

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div>
            <div class="sidebar-brand">
                <span class="logo"><span class="ms">groups</span></span>SIRH Pro
            </div>
            <nav class="nav flex-column">
                <!-- Tout le monde peut voir ses demandes -->
                <a class="nav-link" th:href="@{/demandes}">
                    <span class="ms">assignment</span>Demandes de Recrutement
                </a>

                <!-- Seuls le RH, DG et Manager peuvent voir les employés -->
                <a sec:authorize="hasAnyRole('MANAGER', 'RH', 'DG')" class="nav-link" th:href="@{/employes}">
                    <span class="ms">badge</span>Employés
                </a>

                <!-- RÉFÉRENTIELS : Uniquement RH et DG -->
                <a sec:authorize="hasAnyRole('RH', 'DG')" class="nav-link" th:href="@{/departements}">
                    <span class="ms">apartment</span>Départements
                </a>

                <!-- CANDIDATS : Seulement RH et Manager (pour recruter) -->
                <a sec:authorize="hasAnyRole('RH', 'MANAGER')" class="nav-link" th:href="@{/candidats}">
                    <span class="ms">person_search</span>Candidats
                </a>

                <!-- FINANCE : Uniquement le rôle Finance et DG -->
                <a sec:authorize="hasAnyRole('FINANCE', 'DG')" class="nav-link" th:href="@{/finance}">
                    <span class="ms">payments</span>Validation Financière
                </a>
            </nav>
        </div>

        <div class="sidebar-user d-flex align-items-center justify-content-between">
            <!-- Avatar avec les 2 premières lettres du nom (Variables du Design System) -->
            <div class="avatar" 
                 th:text="${#strings.substring(#authentication.principal.utilisateur.nom, 0, 2)}">
                CD
            </div>

            <!-- Bouton de déconnexion -->
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="icon-btn" title="Déconnexion" type="submit">
                    <span class="ms" style="font-size: 20px;">logout</span>
                </button>
            </form>
        </div>
    </aside>

    <!-- Contenu Principal -->
    <div class="content-wrap">
        <!-- Topbar -->
        <header class="topbar">
            <div class="d-flex align-items-center gap-2 flex-grow-1 me-3">
                <button class="topbar-btn d-lg-none" type="button"
                    onclick="document.getElementById('sidebar').classList.toggle('show')" aria-label="Menu">
                    <span class="ms">menu</span>
                </button>
                <div class="search-box">
                    <span class="ms">search</span>
                    <input type="search" class="form-control" placeholder="Rechercher une demande, un candidat...">
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div class="position-relative">
                    <button class="topbar-btn" title="Notifications" type="button"><span
                            class="ms">notifications</span></button>
                    <span class="notif-dot"></span>
                </div>
                <button class="topbar-btn d-none d-sm-inline-block" title="Aide et Support" type="button"><span
                        class="ms">help</span></button>
            </div>
        </header>

        <!-- Zone d'injection du contenu -->
        <main>
            <div class="page">
                <div th:replace="${content}"></div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
