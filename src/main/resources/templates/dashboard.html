<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="fr" th:fragment="layout(content)">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIRH Pro – Application</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="app-page">

    <!-- INCLUSION DU COMPOSANT SIDEBAR ICI -->
    <div th:replace="~{components/sidebar :: sidebar}"></div>

    <!-- Contenu Principal -->
    <div class="content-wrap">
        <!-- Topbar -->
        <header class="topbar">
            <div class="d-flex align-items-center gap-2 flex-grow-1 me-3">
                <button class="topbar-btn d-lg-none" type="button"
                    onclick="document.getElementById('sidebar').classList.toggle('show')" aria-label="Menu">
                    <span class="ms">menu</span>
                </button>
                
                <div class="search-box">
                    <span class="ms">search</span>
                    <input type="search" class="form-control" placeholder="Rechercher une demande, un candidat...">
                </div>
            </div>
            
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/demandes/validations-en-attente}" class="topbar-btn position-relative" title="Notifications">
                    <span class="ms">notifications</span>
                    <span th:if="${validationsEnAttenteCount > 0}"
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        style="font-size: 10px; padding: 4px 6px; border: 2px solid white;">
                        <span th:text="${validationsEnAttenteCount}">3</span>
                    </span>
                </a>
                
                <button class="topbar-btn d-none d-sm-inline-block" title="Aide et Support" type="button">
                    <span class="ms">help</span>
                </button>
            </div>
        </header>

        <!-- Zone d'injection du contenu -->
        <main>
            <div class="page">
                <!-- Messages Flash -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert"
                    style="border-radius: var(--radius-sm); border-left: 4px solid var(--color-success);">
                    <span class="ms me-2">check_circle</span>
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert"
                    style="border-radius: var(--radius-sm); border-left: 4px solid var(--color-error);">
                    <span class="ms me-2">error</span>
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:replace="${content}"></div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
