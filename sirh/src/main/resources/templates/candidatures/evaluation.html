<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div>
            <h2 class="text-2xl font-bold text-cobalt-900 tracking-tight">
                Évaluer le candidat : <span class="text-cobalt-700" th:text="${candidature.candidat.nom + ' ' + candidature.candidat.prenom}"></span>
            </h2>
        </div>

        <!-- Messages d'alerte -->
        <div th:if="${success}" class="p-4 rounded bg-emerald-50 text-emerald-800 border border-emerald-200 text-sm font-semibold shadow-sm" th:text="${success}"></div>
        <div th:if="${error}" class="p-4 rounded bg-red-50 text-red-800 border border-red-200 text-sm font-semibold shadow-sm" th:text="${error}"></div>

        <div class="flex flex-col gap-6 w-full">

            <!-- 1. Formulaire d'ajout (En haut) -->
            <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden">
                <div class="px-5 py-4 border-b border-neutral-border bg-slate-50">
                    <h3 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider">Ajouter une nouvelle évaluation</h3>
                </div>
                <div class="p-6">
                    <form th:action="@{/candidatures/{id}/evaluer(id=${candidature.idCandidature})}" method="post" class="flex flex-col gap-5">

                        <!-- Grille pour Type et Note -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label for="idTypeEvaluation" class="block text-[11px] uppercase tracking-wider text-slate-700 font-bold mb-2">Type de l'évaluation <span class="text-red-500">*</span></label>
                                <div class="relative">
                                    <select name="idTypeEvaluation" id="idTypeEvaluation" required
                                            class="w-full h-11 pl-3 pr-10 bg-white border border-slate-300 rounded text-sm text-slate-900 focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700 transition-colors appearance-none cursor-pointer">
                                        <option value="">-- Choisissez un type --</option>
                                        <option th:each="type : ${typesEvaluation}" 
                                                th:value="${type.id}" 
                                                th:text="${type.libelle}"></option>
                                    </select>
                                    <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none text-[20px]">expand_more</span>
                                </div>
                            </div>

                            <div>
                                <label for="note" class="block text-[11px] uppercase tracking-wider text-slate-700 font-bold mb-2">Note (sur 20)</label>
                                <input type="number" name="note" id="note" step="0.5" min="0" max="20" placeholder="Ex: 15"
                                       class="w-full h-11 px-3 bg-white border border-slate-300 rounded text-sm text-slate-900 focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700 transition-colors placeholder:text-slate-400">
                            </div>
                        </div>

                        <!-- Commentaire -->
                        <div>
                            <label for="commentaire" class="block text-[11px] uppercase tracking-wider text-slate-700 font-bold mb-2">Commentaire / Compte-rendu <span class="text-red-500">*</span></label>
                            <textarea name="commentaire" id="commentaire" required placeholder="Points forts, points faibles, décision..."
                                      class="w-full p-3 bg-white border border-slate-300 rounded text-sm text-slate-900 focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700 transition-colors min-h-[120px] placeholder:text-slate-400"></textarea>
                        </div>

                        <!-- Bouton -->
                        <div class="flex justify-end pt-4 border-t border-neutral-border">
                            <button type="submit" class="h-9 px-6 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white font-semibold text-xs transition-colors shadow-sm">
                                Enregistrer l'évaluation
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 2. Historique des évaluations (En bas) -->
            <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden">
                <div class="px-5 py-4 border-b border-neutral-border bg-slate-50">
                    <h3 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider">Historique du parcours d'évaluation</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="sirh-table">
                        <thead>
                            <tr>
                                <th scope="col">Type d'évaluation</th>
                                <th scope="col">Note</th>
                                <th scope="col">Compte-rendu</th>
                                <th scope="col">Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${evaluations.isEmpty()}">
                                <td colspan="4" class="td-empty py-8 text-center text-slate-500 italic">
                                    Aucune évaluation pour le moment.
                                </td>
                            </tr>
                            <tr th:each="eval : ${evaluations}">
                                <td class="font-bold text-cobalt-900" th:text="${eval.typeEvaluation.libelle}"></td>
                                <td>
                                    <span th:text="${eval.note != null ? eval.note + ' / 20' : 'N/A'}" 
                                          th:classappend="${eval.note == null ? 'text-slate-500 font-semibold' : (eval.note >= 10 ? 'text-emerald-700 font-bold' : 'text-red-700 font-bold')}">
                                    </span>
                                </td>
                                <td class="text-slate-700 text-sm" th:text="${eval.evaluation}"></td>
                                <td class="text-slate-600 font-mono text-xs whitespace-nowrap" th:text="${#temporals.format(eval.dateEvaluation, 'dd/MM/yyyy HH:mm')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>
</body>
</html>
