<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" th:replace="~{layout :: layout(content=~{::mainContent})}">

<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-2xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div>
            <a th:href="@{/grilles}"
                class="inline-flex items-center gap-1 text-sm text-on-surface-variant hover:text-primary transition-colors mb-2">
                &larr; Retour aux grilles
            </a>
            <h2 class="font-headline-xl text-headline-xl text-on-surface font-bold"
                th:text="${grille.idGrille == null ? 'Nouvelle grille salariale' : 'Modifier la grille salariale'}">
            </h2>
        </div>

        <!-- Message d'erreur -->
        <div th:if="${error}" class="p-4 rounded-lg bg-red-50 text-red-600 border border-red-200 text-sm font-medium"
            th:text="${error}"></div>

        <!-- Formulaire -->
        <div
            class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
            <div class="p-6 md:p-8">
                <form method="post"
                    th:action="${grille.idGrille == null} ? @{/grilles} : @{/grilles/{id}(id=${grille.idGrille})}"
                    th:object="${grille}" class="flex flex-col gap-5">

                    <!-- Poste -->
                    <div>
                        <label for="poste" class="block text-sm font-semibold text-on-surface mb-2">Poste <span
                                class="text-red-500">*</span></label>
                        <select th:field="*{poste.idPoste}" required
                            class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer">
                            <option value="">Sélectionner un poste</option>
                            <option th:each="poste : ${postes}" th:value="${poste.idPoste}" th:text="${poste.intitule}">
                            </option>
                        </select>
                    </div>

                    <!-- Département -->
                    <div>
                        <label for="departement" class="block text-sm font-semibold text-on-surface mb-2">Département
                            <span class="text-red-500">*</span></label>
                        <select th:field="*{departement.idDepartement}" required
                            class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer">
                            <option value="">Sélectionner un département</option>
                            <option th:each="departement : ${departements}" th:value="${departement.idDepartement}"
                                th:text="${departement.titre}"></option>
                        </select>
                    </div>

                    <!-- Salaire Min -->
                    <div>
                        <label for="salaireMin" class="block text-sm font-semibold text-on-surface mb-2">Salaire minimum
                            <span class="text-red-500">*</span></label>
                        <input type="number" th:field="*{salaireMin}" step="0.01" min="0" required
                            class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                    </div>

                    <!-- Salaire Moyen -->
                    <div>
                        <label for="salaireMoyen" class="block text-sm font-semibold text-on-surface mb-2">Salaire moyen
                            <span class="text-red-500">*</span></label>
                        <input type="number" th:field="*{salaireMoyen}" step="0.01" min="0" required
                            class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                    </div>

                    <!-- Salaire Max -->
                    <div>
                        <label for="salaireMax" class="block text-sm font-semibold text-on-surface mb-2">Salaire maximum
                            <span class="text-red-500">*</span></label>
                        <input type="number" th:field="*{salaireMax}" step="0.01" min="0" required
                            class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center justify-end gap-3 pt-6 border-t border-surface-container-high mt-2">
                        <a th:href="@{/grilles}"
                            class="h-11 px-6 rounded-lg bg-surface-container text-on-surface hover:bg-surface-container-high font-medium text-sm transition-colors border border-surface-container-high flex items-center">
                            Annuler
                        </a>
                        <button type="submit"
                            class="h-11 px-6 rounded-lg bg-primary text-on-primary hover:bg-primary-container font-medium text-sm transition-colors shadow-sm">
                            Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>
</body>

</html>
