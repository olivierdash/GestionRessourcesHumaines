<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

<main th:fragment="mainContent" class="w-full flex flex-col gap-6">

    <div>
        <h2 class="text-2xl font-bold text-cobalt-900 tracking-tight">Types de contrat</h2>
        <p class="text-sm text-slate-600 mt-1" th:text="${#lists.size(types)} + ' type(s)'"></p>
    </div>

    <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden">
        <table class="sirh-table">
            <thead>
                <tr>
                    <th scope="col">Libellé</th>
                    <th scope="col">Durée maximale</th>
                    <th scope="col" class="text-right">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${types}">
                    <td class="font-bold text-cobalt-900" th:text="${t.libelle}"></td>
                    <td class="text-slate-700">
                        <span th:if="${t.dureeMaxMois != null}"
                              th:text="${t.dureeMaxMois} + ' mois'"></span>
                        <span th:if="${t.dureeMaxMois == null}"
                              class="text-slate-400 italic">Sans limite</span>
                    </td>
                    <td class="text-right">
                        <a th:href="@{/types-contrat/{id}/edit(id=${t.id})}"
                           class="inline-flex items-center h-7 px-3 rounded bg-white border border-slate-300 text-cobalt-700 hover:bg-slate-50 text-xs font-semibold">
                            Modifier la durée
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
