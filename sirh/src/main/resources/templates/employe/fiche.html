<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" th:replace="~{layout :: layout(content=~{::mainContent})}">

<body>

    <main th:fragment="mainContent" class="w-full flex flex-col gap-6">

        <!-- En-tête -->
        <!-- En-tête -->
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
            <div>
                <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight flex flex-wrap items-center gap-3">
                    Fiche salarié
                    <span class="px-2.5 py-1 bg-cobalt-800 text-white font-mono text-sm rounded font-bold tracking-wide"
                        th:text="${employe.matricule}">
                    </span>
                </h1>
                <p class="text-xs text-slate-500 mt-1 font-mono"
                    th:text="${'Embauché(e) le ' + #temporals.format(employe.hiringDate, 'dd/MM/yyyy')}">
                </p>
            </div>

            <!-- Lien vers la candidature d'origine -->
            <a th:href="@{/candidatures/{id}(id=${employe.candidature.idCandidature})}"
                class="inline-flex items-center gap-1 self-start md:self-auto text-xs font-bold text-cobalt-800 hover:text-cobalt-900 underline">
                Voir la candidature d'origine
                <span class="font-mono text-slate-500"></span>
                →
            </a>
        </div>

        <!-- Message de succès -->
        <div th:if="${succes}"
            class="p-4 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-sm font-semibold shadow-sm"
            th:text="${succes}"></div>

        <!-- Carte d'informations générales -->
        <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden">
            <div class="px-5 py-4 border-b border-neutral-border bg-slate-50">
                <h3 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider">Informations générales</h3>
            </div>
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <span class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Nom
                        complet</span>
                    <div class="text-sm font-bold text-slate-800"
                        th:text="${employe.candidature.candidat.prenom + ' ' + employe.candidature.candidat.nom}"></div>
                </div>
                <div>
                    <span
                        class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Matricule</span>
                    <div class="text-sm font-mono text-cobalt-900 font-bold" th:text="${employe.matricule}"></div>
                </div>
                <div>
                    <span class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Date
                        d'embauche</span>
                    <div class="text-sm font-mono text-slate-600"
                        th:text="${#temporals.format(employe.hiringDate, 'dd/MM/yyyy')}"></div>
                </div>
                <div>
                    <span class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Statut</span>
                    <span
                        class="inline-flex items-center px-2 py-0.5 rounded border text-[10px] font-bold uppercase tracking-wider"
                        th:classappend="${employe.statusEmployer == 'ACTIF' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-slate-100 border-slate-200 text-slate-600'}"
                        th:text="${employe.statusEmployer}">
                    </span>
                </div>
            </div>
        </div>

        <!-- Section Contrats -->
        <h2 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider mt-2">Contrats</h2>
        <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden">
            <div class="overflow-x-auto">
                <table class="sirh-table">
                    <thead>
                        <tr>
                            <th scope="col">Type</th>
                            <th scope="col">Poste</th>
                            <th scope="col">Début</th>
                            <th scope="col">Fin</th>
                            <th scope="col">Salaire mensuel</th>
                            <th scope="col">Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(contrats)}">
                            <td colspan="6" class="td-empty py-6 text-center text-slate-500 italic">Aucun contrat
                                enregistré.</td>
                        </tr>
                        <tr th:each="c : ${contrats}">
                            <td class="font-bold text-cobalt-900" th:text="${c.typeContrat.libelle}"></td>
                            <td class="text-slate-600" th:text="${c.poste.intitule}"></td>
                            <td class="font-mono text-slate-600"
                                th:text="${#temporals.format(c.dateDebut, 'dd/MM/yyyy')}"></td>
                            <!-- Correction Thymeleaf : condition ternaire propre -->
                            <td class="font-mono text-slate-600"
                                th:text="${c.dateFin != null ? #temporals.format(c.dateFin, 'dd/MM/yyyy') : '-'}"></td>
                            <td class="font-mono font-semibold text-slate-700"
                                th:text="${#numbers.formatDecimal(c.salaireMensuel, 0, 'COMMA', 2, 'POINT')} + ' €'">
                            </td>
                            <td>
                                <span
                                    class="px-2 py-0.5 bg-slate-100 border border-slate-200 text-slate-600 text-[10px] font-bold uppercase tracking-wider rounded"
                                    th:text="${c.status}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Section Affectations -->
        <h2 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider mt-2">Affectations</h2>
        <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden">
            <div class="overflow-x-auto">
                <table class="sirh-table">
                    <thead>
                        <tr>
                            <th scope="col">Poste</th>
                            <th scope="col">Début</th>
                            <th scope="col">Fin</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(affectations)}">
                            <td colspan="3" class="td-empty py-6 text-center text-slate-500 italic">Aucune affectation
                                enregistrée.</td>
                        </tr>
                        <tr th:each="a : ${affectations}">
                            <td class="font-bold text-cobalt-900" th:text="${a.poste.intitule}"></td>
                            <td class="font-mono text-slate-600"
                                th:text="${#temporals.format(a.dateDebut, 'dd/MM/yyyy')}"></td>
                            <!-- Correction Thymeleaf -->
                            <td class="font-mono text-slate-600"
                                th:text="${a.dateFin != null ? #temporals.format(a.dateFin, 'dd/MM/yyyy') : '-'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</body>

</html>
