<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 class="text-2xl font-bold text-cobalt-900 tracking-tight" th:text="${poste.intitule}"></h2>
            </div>
            <a th:href="@{/postes/{id}/edit(id=${poste.idPoste})}" 
               class="inline-flex items-center gap-1.5 px-4 h-9 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white font-semibold text-xs shadow-sm transition-colors">
                <span class="material-symbols-outlined text-[16px]">edit</span>
                Modifier
            </a>
        </div>

        <!-- Message d'erreur -->
        <div th:if="${error}" class="p-4 rounded bg-red-50 text-red-800 border border-red-200 text-sm font-semibold shadow-sm" th:text="${error}"></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- Colonne Gauche : Infos -->
            <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden">
                <div class="px-5 py-4 border-b border-neutral-border bg-slate-50">
                    <h3 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider">Informations du poste</h3>
                </div>
                <div class="p-6 flex flex-col gap-4">
                    <p class="m-0 text-sm"><strong class="text-slate-700 uppercase tracking-wider text-[11px] mr-2">Intitulé :</strong> <span class="text-cobalt-900 font-bold" th:text="${poste.intitule}"></span></p>
                    <p class="m-0 text-sm"><strong class="text-slate-700 uppercase tracking-wider text-[11px] mr-2">Département :</strong> <span class="text-slate-800 font-semibold" th:text="${poste.departement.titre}"></span></p>
                    <p class="m-0 text-sm"><strong class="text-slate-700 uppercase tracking-wider text-[11px] mr-2">Lieu :</strong> <span class="text-slate-800" th:text="${poste.lieu != null ? poste.lieu : 'Non précisé'}"></span></p>
                    <p class="m-0 text-sm"><strong class="text-slate-700 uppercase tracking-wider text-[11px] mr-2">Date d'effet :</strong> <span class="text-slate-800 font-mono" th:text="${poste.dateEffet != null ? poste.dateEffet : 'Non précisée'}"></span></p>
                    <p class="m-0 text-sm">
                        <strong class="text-slate-700 uppercase tracking-wider text-[11px] mr-2">Durée hebdomadaire :</strong> 
                        <span class="text-slate-800" th:if="${poste.dureeHebdo != null}" th:text="${poste.dureeHebdo + ' heures'}"></span>
                        <span class="text-slate-500 italic" th:if="${poste.dureeHebdo == null}">Non précisée</span>
                    </p>
                </div>
            </div>

            <!-- Colonne Droite : Ajouter mission -->
            <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden">
                <div class="px-5 py-4 border-b border-neutral-border bg-slate-50">
                    <h3 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider">Ajouter une mission</h3>
                </div>
                <div class="p-6">
                    <form method="post" th:action="@{/postes/{id}/missions(id=${poste.idPoste})}" class="flex flex-col gap-4">
                        <div>
                            <label for="titre" class="block text-[11px] uppercase tracking-wider text-slate-700 font-bold mb-2">Titre de la mission</label>
                            <input type="text" id="titre" name="titre" maxlength="255" required placeholder="Ex: Gérer l'infrastructure cloud..."
                                   class="w-full h-11 px-3 bg-white border border-slate-300 rounded text-sm text-slate-900 focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700 transition-colors placeholder:text-slate-400">
                        </div>
                        <button type="submit" class="h-9 px-4 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white font-semibold text-xs transition-colors shadow-sm self-start">
                            Ajouter la mission
                        </button>
                    </form>
                </div>
            </div>

            <!-- Ligne du bas : Missions -->
            <div class="lg:col-span-2 bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden">
                <div class="px-5 py-4 border-b border-neutral-border bg-slate-50">
                    <h3 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider">Missions du poste</h3>
                </div>
                <div class="p-6">
                    <div th:if="${#lists.isEmpty(missions)}" class="text-sm text-slate-500 italic py-2">
                        Aucune mission n'est définie pour ce poste.
                    </div>

                    <div th:if="${!#lists.isEmpty(missions)}" class="flex flex-col">
                        <div th:each="mission : ${missions}" class="flex justify-between items-center border-b border-neutral-border py-3 last:border-0">
                            <span class="text-sm font-semibold text-slate-800" th:text="${mission.titre}"></span>

                            <form method="post" th:action="@{/postes/{id}/missions/{missionId}/delete(id=${poste.idPoste}, missionId=${mission.idMission})}" class="m-0">
                                <button type="submit" class="inline-flex items-center justify-center h-7 px-3 rounded bg-red-50 text-red-700 hover:bg-red-100 transition-colors border border-red-200 font-semibold text-xs"
                                        onclick="return confirm('Supprimer cette mission ?');">
                                    Supprimer
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>
</body>
</html>
