<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 class="font-headline-xl text-headline-xl text-on-surface font-bold">Référentiel des postes</h2>
                <p class="text-sm text-on-surface-variant mt-1">Consultez les postes disponibles dans l'entreprise.</p>
            </div>
            <a th:href="@{/postes/create}" class="inline-flex items-center gap-2 h-10 px-4 rounded-lg bg-primary text-on-primary hover:bg-primary-container transition-colors shadow-sm font-medium text-sm">
                <span class="material-symbols-outlined text-[18px]">add</span>
                Nouveau poste
            </a>
        </div>

        <!-- Message vide -->
        <div th:if="${#lists.isEmpty(postes)}" class="p-4 rounded-lg bg-blue-50 text-blue-700 border border-blue-200 text-sm font-medium">
            Aucun poste n'a encore été créé.
        </div>

        <!-- Tableau -->
        <div th:if="${!#lists.isEmpty(postes)}" class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
            <div class="overflow-x-auto">
                <table class="sirh-table">
                    <thead>
                        <tr>
                            <th scope="col">Intitulé</th>
                            <th scope="col">Département</th>
                            <th scope="col">Lieu</th>
                            <th scope="col">Durée hebdomadaire</th>
                            <th scope="col" class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="poste : ${postes}">
                            <td class="font-medium text-on-surface" th:text="${poste.intitule}"></td>
                            <td th:text="${poste.departement.titre}"></td>
                            <td th:text="${poste.lieu != null ? poste.lieu : '-'}"></td>
                            <td>
                                <span th:if="${poste.dureeHebdo != null}" th:text="${poste.dureeHebdo + ' h/semaine'}"></span>
                                <span th:if="${poste.dureeHebdo == null}">-</span>
                            </td>
                            <td class="text-right whitespace-nowrap">
                                <a th:href="@{/postes/{id}(id=${poste.idPoste})}" 
                                   class="inline-flex items-center justify-center h-8 px-3 rounded-lg bg-surface-container text-on-surface hover:bg-surface-container-high font-medium text-xs transition-colors border border-surface-container-high">
                                    Consulter
                                </a>
                                <a th:href="@{/postes/{id}/edit(id=${poste.idPoste})}" 
                                   class="inline-flex items-center justify-center h-8 px-3 rounded-lg bg-primary text-on-primary hover:bg-primary-container font-medium text-xs transition-colors shadow-sm ml-2">
                                    Modifier
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</body>
</html>
