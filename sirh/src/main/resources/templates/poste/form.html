<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-2xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div>
            <a th:href="@{/postes}" class="inline-flex items-center gap-1 text-sm text-on-surface-variant hover:text-primary transition-colors mb-2">
                &larr; Retour aux postes
            </a>
            <h2 class="font-headline-xl text-headline-xl text-on-surface font-bold" 
                th:text="${poste.idPoste == null ? 'Nouveau poste' : 'Modifier le poste'}">
            </h2>
        </div>

        <!-- Message d'erreur -->
        <div th:if="${error}" class="p-4 rounded-lg bg-red-50 text-red-600 border border-red-200 text-sm font-medium" th:text="${error}"></div>

        <!-- Formulaire -->
        <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
            <div class="p-6 md:p-8">
                <form method="post" th:action="${poste.idPoste == null} ? @{/postes} : @{/postes/{id}(id=${poste.idPoste})}" class="flex flex-col gap-5">

                    <!-- Intitulé -->
                    <div>
                        <label for="intitule" class="block text-sm font-semibold text-on-surface mb-2">Intitulé du poste <span class="text-red-500">*</span></label>
                        <input type="text" id="intitule" name="intitule" th:value="${poste.intitule}" required maxlength="255"
                               class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                    </div>

                    <!-- Département -->
                    <div>
                        <label for="idDepartement" class="block text-sm font-semibold text-on-surface mb-2">Département <span class="text-red-500">*</span></label>
                        <select id="idDepartement" name="idDepartement" required
                                class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer">
                            <option value="">Sélectionner un département</option>
                            <option th:each="departement : ${departements}"
                                    th:value="${departement.idDepartement}"
                                    th:text="${departement.titre}"
                                    th:selected="${poste.departement != null and poste.departement.idDepartement == departement.idDepartement}">
                            </option>
                        </select>
                    </div>

                    <!-- Date d'effet -->
                    <div>
                        <label for="dateEffet" class="block text-sm font-semibold text-on-surface mb-2">Date d'effet</label>
                        <input type="date" id="dateEffet" name="dateEffet" th:value="${poste.dateEffet}"
                               class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                    </div>

                    <!-- Lieu -->
                    <div>
                        <label for="lieu" class="block text-sm font-semibold text-on-surface mb-2">Lieu</label>
                        <input type="text" id="lieu" name="lieu" th:value="${poste.lieu}" maxlength="255"
                               class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                    </div>

                    <!-- Durée hebdo -->
                    <div>
                        <label for="dureeHebdo" class="block text-sm font-semibold text-on-surface mb-2">Durée hebdomadaire</label>
                        <input type="number" id="dureeHebdo" name="dureeHebdo" th:value="${poste.dureeHebdo}" min="1" max="168"
                               class="w-full h-11 px-3 bg-surface-container-low border border-transparent rounded-lg text-sm text-on-surface focus:outline-none focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">
                        <div class="mt-1 text-xs text-outline">Durée en heures par semaine.</div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center justify-end gap-3 pt-6 border-t border-surface-container-high mt-2">
                        <a th:href="@{/postes}" class="h-11 px-6 rounded-lg bg-surface-container text-on-surface hover:bg-surface-container-high font-medium text-sm transition-colors border border-surface-container-high flex items-center">
                            Annuler
                        </a>
                        <button type="submit" class="h-11 px-6 rounded-lg bg-primary text-on-primary hover:bg-primary-container font-medium text-sm transition-colors shadow-sm">
                            Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>
</body>
</html>
