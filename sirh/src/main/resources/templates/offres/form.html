<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="w-full flex flex-col gap-6">

        <!-- En-tête -->
        <div>
            <h2 class="text-2xl font-bold text-cobalt-900 tracking-tight">Créer une nouvelle offre</h2>
        </div>

        <!-- Carte du formulaire -->
        <div class="w-full">
            <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden">
                <div class="p-6 md:p-8">

                    <!-- Bandeau d'erreur global -->
                    <div th:if="${errorMessage}" class="p-4 mb-6 rounded bg-red-50 text-red-800 border border-red-200 text-sm font-semibold shadow-sm flex items-center gap-2">
                        <span class="material-symbols-outlined text-[20px]">error</span>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/offres/creer}" th:object="${offre}" method="post">

                        <!-- Demande liée -->
                        <div class="mb-6">
                            <label for="idDemande" class="block text-[11px] uppercase tracking-wider text-slate-500 font-bold mb-2">Demande de recrutement liée <span class="text-red-500">*</span></label>
                            <select th:field="*{demandeRecrutement.idDemandeRecrutement}" id="idDemande" 
                                    class="w-full h-11 px-3 bg-white border rounded text-sm text-body-text focus:outline-none transition-colors cursor-pointer"
                                    th:classappend="${errors != null and errors['demandeRecrutement.idDemandeRecrutement'] != null} ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500' : 'border-neutral-border focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700'">
                                <option value="">-- Sélectionnez une demande --</option>
                                <option th:each="dem : ${demandes}" 
                                        th:value="${dem.idDemandeRecrutement}" 
                                        th:text="${'Demande #' + dem.idDemandeRecrutement + ' - ' + dem.poste.intitule}">
                                </option>
                            </select>
                            <p th:if="${errors != null and errors['demandeRecrutement.idDemandeRecrutement'] != null}" 
                               th:text="${errors['demandeRecrutement.idDemandeRecrutement']}" 
                               class="mt-1 text-xs text-red-500 font-semibold"></p>
                        </div>

                        <!-- Titre -->
                        <div class="mb-6">
                            <label for="titre" class="block text-[11px] uppercase tracking-wider text-slate-500 font-bold mb-2">Titre de l'offre <span class="text-red-500">*</span></label>
                            <input type="text" th:field="*{titre}" id="titre" required placeholder="Ex: Développeur Java Senior"
                                   class="w-full h-11 px-3 bg-white border rounded text-sm text-body-text focus:outline-none transition-colors"
                                   th:classappend="${errors != null and errors['titre'] != null} ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500' : 'border-neutral-border focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700'">
                            <p th:if="${errors != null and errors['titre'] != null}" 
                               th:text="${errors['titre']}" 
                               class="mt-1 text-xs text-red-500 font-semibold"></p>
                        </div>

                        <!-- Date de publication -->
                        <div class="mb-6">
                            <label for="datePublication" class="block text-[11px] uppercase tracking-wider text-slate-500 font-bold mb-2">Date de publication</label>
                            <input type="datetime-local" th:field="*{datePublication}" id="datePublication"
                                   class="w-full h-11 px-3 bg-white border border-neutral-border rounded text-sm text-body-text focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700 transition-colors">
                        </div>

                        <!-- Description -->
                        <div class="mb-8">
                            <label for="description" class="block text-[11px] uppercase tracking-wider text-slate-500 font-bold mb-2">Description <span class="text-red-500">*</span></label>
                            <textarea th:field="*{description}" id="description" rows="5" required placeholder="Missions, profil recherché..."
                                      class="w-full p-3 bg-white border rounded text-sm text-body-text focus:outline-none transition-colors"
                                      th:classappend="${errors != null and errors['description'] != null} ? 'border-red-500 focus:border-red-500 focus:ring-1 focus:ring-red-500' : 'border-neutral-border focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700'"></textarea>
                            <p th:if="${errors != null and errors['description'] != null}" 
                               th:text="${errors['description']}" 
                               class="mt-1 text-xs text-red-500 font-semibold"></p>
                        </div>

                        <!-- Actions -->
                        <div class="flex items-center justify-end gap-3 pt-6 border-t border-neutral-border">
                            <a th:href="@{/offres}" class="h-9 px-4 rounded bg-surface-card border border-neutral-border text-slate-700 hover:bg-slate-50 font-semibold text-xs transition-colors shadow-sm flex items-center">
                                Annuler
                            </a>
                            <button type="submit" class="h-9 px-4 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white font-semibold text-xs transition-colors shadow-sm">
                                Enregistrer en brouillon
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>

    </main>
</body>
</html>
