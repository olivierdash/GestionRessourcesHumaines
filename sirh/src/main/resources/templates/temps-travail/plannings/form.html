<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

<main th:fragment="mainContent" class="w-full flex flex-col gap-6">

    <div>
        <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight">Nouveau planning</h1>
        <p class="text-sm text-slate-600 mt-1">
            Un planning associe un régime de travail à une période. Il pourra ensuite être affecté à plusieurs salariés.
        </p>
    </div>

    <div th:if="${erreur}"
         class="p-4 rounded bg-red-50 text-red-600 border border-red-200 text-sm font-semibold shadow-sm"
         th:text="${erreur}"></div>

    <form th:action="@{/temps-travail/plannings}" method="post"
          th:object="${planning}"
          class="bg-surface-card p-6 rounded-lg border border-neutral-border max-w-2xl flex flex-col gap-5 shadow-sm">

        <div>
            <label for="libelle" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">
                Libellé <span class="text-red-500">*</span>
            </label>
            <input id="libelle" type="text" th:field="*{libelle}" required maxlength="255"
                   placeholder="Ex : Planning équipe matin"
                   class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
        </div>

        <div>
            <label for="regimeTravail" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">
                Régime de travail <span class="text-red-500">*</span>
            </label>
            <select id="regimeTravail" th:field="*{regimeTravail.id}" required
                    class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700 cursor-pointer">
                <option value="">Sélectionner un régime</option>
                <option th:each="regime : ${regimes}"
                        th:value="${regime.id}"
                        th:text="${regime.code + ' — ' + regime.libelle}"></option>
            </select>
            <p class="text-xs text-slate-500 mt-1">
                Seuls les régimes actifs peuvent être utilisés.
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="dateDebut" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">
                    Date de début <span class="text-red-500">*</span>
                </label>
                <input id="dateDebut" type="date" th:field="*{dateDebut}" required
                       class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
            </div>
            <div>
                <label for="dateFin" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">
                    Date de fin (optionnelle)
                </label>
                <input id="dateFin" type="date" th:field="*{dateFin}"
                       class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
            </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-neutral-border">
            <a th:href="@{/temps-travail/plannings}"
               class="h-10 px-4 flex items-center rounded bg-surface-card border border-neutral-border text-slate-700 text-sm font-semibold hover:bg-slate-50">
                Annuler
            </a>
            <button type="submit"
                    class="h-10 px-5 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white text-sm font-semibold shadow-sm">
                Enregistrer
            </button>
        </div>
    </form>

</main>
</body>
</html>
