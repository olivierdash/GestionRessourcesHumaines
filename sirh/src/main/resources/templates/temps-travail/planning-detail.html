<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body><main th:fragment="mainContent" class="w-full flex flex-col gap-6">
    <div class="flex items-end justify-between"><div><h1 class="text-2xl font-bold text-cobalt-900" th:text="${planning.libelle}"></h1><p class="text-sm text-slate-600 mt-1" th:text="${planning.regimeTravail.libelle}"></p></div><a th:href="@{/temps-travail/plannings}" class="text-sm text-cobalt-700 font-semibold">Retour</a></div>
    <div th:if="${succes}" class="p-3 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-sm" th:text="${succes}"></div>
    <div th:if="${erreur}" class="p-3 rounded bg-red-50 text-red-700 border border-red-200 text-sm" th:text="${erreur}"></div>
    <form th:action="@{/temps-travail/plannings/{id}/affectations(id=${planning.id})}" method="post" class="bg-surface-card p-6 rounded-lg border border-neutral-border grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Salarié</label><select required name="employeId" class="w-full h-10 border border-neutral-border rounded px-2"><option value="">Sélectionner</option><option th:each="employe : ${employes}" th:value="${employe.idEmployer}" th:text="${employe.matricule + ' - #' + employe.idEmployer}"></option></select></div>
        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Début</label><input required type="date" name="dateDebut" class="w-full h-10 border border-neutral-border rounded px-2"></div>
        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Fin (optionnelle)</label><input type="date" name="dateFin" class="w-full h-10 border border-neutral-border rounded px-2"></div>
        <button class="h-10 rounded bg-cobalt-700 text-white text-xs font-semibold">Affecter</button>
    </form>
    <div class="bg-surface-card rounded-lg border border-neutral-border overflow-hidden"><table class="sirh-table"><thead><tr><th>Salarié</th><th>Début</th><th>Fin</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(affectations)}"><td colspan="3" class="td-empty text-center py-8">Aucune affectation.</td></tr><tr th:each="affectation : ${affectations}"><td class="font-bold" th:text="${affectation.employe.matricule}"></td><td th:text="${#temporals.format(affectation.dateDebut, 'dd/MM/yyyy')}"></td><td th:text="${affectation.dateFin == null ? 'En cours' : #temporals.format(affectation.dateFin, 'dd/MM/yyyy')}"></td></tr></tbody></table></div>
</main></body>
</html>
