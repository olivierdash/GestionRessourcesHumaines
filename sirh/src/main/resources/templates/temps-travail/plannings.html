<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>
<main th:fragment="mainContent" class="w-full flex flex-col gap-6">
    <div class="flex items-end justify-between"><div><h1 class="text-2xl font-bold text-cobalt-900">Plannings</h1><p class="text-sm text-slate-600 mt-1">Affectez un régime de travail sur une période.</p></div>
        <a th:href="@{/temps-travail/plannings/nouveau}" class="h-9 px-4 rounded bg-cobalt-700 text-white text-xs font-semibold flex items-center">Nouveau planning</a></div>
    <div class="bg-surface-card rounded-lg border border-neutral-border overflow-hidden">
        <table class="sirh-table"><thead><tr><th>Planning</th><th>Régime</th><th>Début</th><th>Fin</th><th></th></tr></thead>
            <tbody><tr th:if="${#lists.isEmpty(plannings)}"><td colspan="5" class="td-empty text-center py-8">Aucun planning.</td></tr>
            <tr th:each="planning : ${plannings}"><td class="font-bold text-cobalt-900" th:text="${planning.libelle}"></td><td th:text="${planning.regimeTravail.libelle}"></td><td th:text="${#temporals.format(planning.dateDebut, 'dd/MM/yyyy')}"></td><td th:text="${planning.dateFin == null ? 'Sans date de fin' : #temporals.format(planning.dateFin, 'dd/MM/yyyy')}"></td><td class="text-right"><a th:href="@{/temps-travail/plannings/{id}(id=${planning.id})}" class="text-cobalt-700 text-xs font-semibold">Consulter</a></td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
