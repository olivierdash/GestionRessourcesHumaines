<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body><main th:fragment="mainContent" class="w-full flex flex-col gap-6">
    <div><h1 class="text-2xl font-bold text-cobalt-900">Nouveau planning</h1><p class="text-sm text-slate-600 mt-1">Un planning peut ensuite être affecté à plusieurs salariés.</p></div>
    <form th:action="@{/temps-travail/plannings}" method="post" class="bg-surface-card p-6 rounded-lg border border-neutral-border max-w-2xl flex flex-col gap-5">
        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Libellé</label><input required name="libelle" placeholder="Ex : Planning équipe matin" class="w-full h-10 border border-neutral-border rounded px-3"></div>
        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Régime de travail</label><select required name="regimeId" class="w-full h-10 border border-neutral-border rounded px-3"><option value="">Sélectionner</option><option th:each="regime : ${regimes}" th:value="${regime.id}" th:text="${regime.libelle + ' - ' + regime.heuresHebdomadaires + ' h/semaine'}"></option></select></div>
        <div class="grid grid-cols-2 gap-4"><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Date de début</label><input required type="date" name="dateDebut" class="w-full h-10 border border-neutral-border rounded px-3"></div><div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Date de fin (optionnelle)</label><input type="date" name="dateFin" class="w-full h-10 border border-neutral-border rounded px-3"></div></div>
        <div class="flex justify-end gap-3"><a th:href="@{/temps-travail/plannings}" class="h-10 px-4 flex items-center text-sm">Annuler</a><button class="h-10 px-5 rounded bg-cobalt-700 text-white text-sm font-semibold">Enregistrer</button></div>
    </form>
</main></body>
</html>
