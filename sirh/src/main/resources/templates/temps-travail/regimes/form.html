<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

<main th:fragment="mainContent" class="w-full flex flex-col gap-6">

    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight"
                th:text="${regime.id == null ? 'Nouveau régime' : 'Modifier le régime'}"></h1>
            <p th:if="${regime.id != null}"
               class="text-xs text-slate-500 mt-1 font-mono"
               th:text="${'Code : ' + regime.code}"></p>
        </div>
        <a th:href="@{/temps-travail/regimes}"
           class="text-sm text-cobalt-700 font-semibold flex items-center gap-1 self-start md:self-auto">
            <span class="material-symbols-outlined text-[16px]">arrow_back</span>
            Retour
        </a>
    </div>

    <div th:if="${erreur}"
         class="p-4 rounded bg-red-50 text-red-600 border border-red-200 text-sm font-semibold shadow-sm"
         th:text="${erreur}"></div>
    <div th:if="${succes}"
         class="p-4 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-sm font-semibold shadow-sm"
         th:text="${succes}"></div>

    <form th:action="@{/temps-travail/regimes}" method="post" th:object="${regime}"
          class="flex flex-col gap-6">
        <input type="hidden" th:field="*{id}">

        <!-- 1. IDENTIFICATION -->
        <div class="bg-surface-card p-6 rounded-lg border border-neutral-border shadow-sm">
            <div class="flex items-center gap-2 mb-5">
                <span class="material-symbols-outlined text-[20px] text-cobalt-700">badge</span>
                <h2 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider m-0">Identification</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div>
                    <label for="code" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">
                        Code <span class="text-red-500">*</span>
                    </label>
                    <input id="code" type="text" th:field="*{code}" required maxlength="30" placeholder="35H"
                           class="w-full h-10 border border-neutral-border rounded px-3 text-sm font-mono focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                </div>

                <div class="md:col-span-2">
                    <label for="libelle" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">
                        Libellé <span class="text-red-500">*</span>
                    </label>
                    <input id="libelle" type="text" th:field="*{libelle}" required maxlength="255"
                           placeholder="Temps plein 35 heures"
                           class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                </div>

                <div class="md:col-span-3">
                    <label for="description" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">
                        Description
                    </label>
                    <textarea id="description" th:field="*{description}" rows="2" maxlength="500"
                              placeholder="Description optionnelle"
                              class="w-full border border-neutral-border rounded px-3 py-2 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700"></textarea>
                </div>
            </div>
        </div>

        <!-- 2. TYPE ET PARAMÈTRES -->
        <div class="bg-surface-card p-6 rounded-lg border border-neutral-border shadow-sm">
            <div class="flex items-center gap-2 mb-5">
                <span class="material-symbols-outlined text-[20px] text-cobalt-700">rule</span>
                <h2 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider m-0">Type et paramètres de décompte</h2>
            </div>

            <!-- Le Switch Coulissant (Heures / Jours) -->
            <div class="mb-6">
                <div class="relative flex p-1 bg-slate-100 rounded-lg w-full max-w-sm border border-slate-200 shadow-inner">
                    <!-- L'arrière-plan blanc qui glisse -->
                    <div id="toggle-slider" class="absolute top-1 bottom-1 left-1 w-[calc(50%-0.25rem)] bg-white rounded-md shadow-sm transition-transform duration-300 ease-in-out z-0"></div>
                    
                    <!-- Les boutons cliquables par-dessus -->
                    <button type="button" id="btn-heures" class="relative z-10 w-1/2 py-1.5 text-sm font-bold text-cobalt-900 transition-colors" onclick="setDecompteType(false)">
                        Décompte en heures
                    </button>
                    <button type="button" id="btn-jours" class="relative z-10 w-1/2 py-1.5 text-sm font-bold text-slate-500 transition-colors" onclick="setDecompteType(true)">
                        Forfait jours
                    </button>
                    
                    <!-- Le vrai champ caché pour Spring -->
                    <input type="checkbox" th:field="*{forfaitJours}" id="forfaitJours" class="hidden">
                </div>
            </div>

            <!-- Champs HEURES -->
            <div id="bloc-heures" class="mt-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="heuresHebdomadaires" class="block text-[11px] font-bold uppercase text-slate-500 mb-2">
                            Heures hebdomadaires
                        </label>
                        <div class="relative">
                            <input id="heuresHebdomadaires" type="number" step="0.5" min="0" max="99.9"
                                   th:field="*{heuresHebdomadaires}" placeholder="35"
                                   class="w-full h-10 border border-neutral-border rounded pl-3 pr-8 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-400">h</span>
                        </div>
                    </div>
                    <div>
                        <label for="seuilHeuresSupplementaires" class="block text-[11px] font-bold uppercase text-slate-500 mb-2">
                            Seuil d'heures supplémentaires
                        </label>
                        <div class="relative">
                            <input id="seuilHeuresSupplementaires" type="number" step="0.5" min="0" max="99.9"
                                   th:field="*{seuilHeuresSupplementaires}" placeholder="35"
                                   class="w-full h-10 border border-neutral-border rounded pl-3 pr-8 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-400">h</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Champs JOURS -->
            <div id="bloc-jours" class="mt-4 hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="joursAnnuelsReference" class="block text-[11px] font-bold uppercase text-slate-500 mb-2">
                            Jours annuels de référence
                        </label>
                        <div class="relative">
                            <input id="joursAnnuelsReference" type="number" min="1" max="218"
                                   th:field="*{joursAnnuelsReference}" placeholder="218"
                                   class="w-full h-10 border border-neutral-border rounded pl-3 pr-14 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-400">jours</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. LIMITES ET OPTIONS -->
        <div class="bg-surface-card p-6 rounded-lg border border-neutral-border shadow-sm">
            <div class="flex items-center gap-2 mb-5">
                <span class="material-symbols-outlined text-[20px] text-cobalt-700">gavel</span>
                <h2 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider m-0">Limites légales et options</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                <div>
                    <label for="dureeMaxHebdomadaire" class="block text-[11px] font-bold uppercase text-slate-500 mb-2">
                        Durée max hebdomadaire
                    </label>
                    <div class="relative">
                        <input id="dureeMaxHebdomadaire" type="number" min="1" max="48"
                               th:field="*{dureeMaxHebdomadaire}" placeholder="48"
                               class="w-full h-10 border border-neutral-border rounded pl-3 pr-8 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-400">h</span>
                    </div>
                </div>
                <div>
                    <label for="dureeMaxJournaliere" class="block text-[11px] font-bold uppercase text-slate-500 mb-2">
                        Durée max journalière
                    </label>
                    <div class="relative">
                        <input id="dureeMaxJournaliere" type="number" min="1" max="12"
                               th:field="*{dureeMaxJournaliere}" placeholder="10"
                               class="w-full h-10 border border-neutral-border rounded pl-3 pr-8 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm font-semibold text-slate-400">h</span>
                    </div>
                </div>
            </div>

            <!-- Checkboxes en tuiles -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t border-neutral-border">
                <label class="flex items-center gap-3 p-3 rounded-lg border border-neutral-border bg-slate-50/50 hover:bg-slate-50 cursor-pointer transition-colors">
                    <input type="checkbox" th:field="*{pointageObligatoire}" class="w-5 h-5 text-cobalt-700 rounded focus:ring-cobalt-700">
                    <div>
                        <span class="block text-sm font-bold text-slate-800">Pointage obligatoire</span>
                        <span class="block text-[11px] text-slate-500">Requis pour les décomptes horaires</span>
                    </div>
                </label>
                <label class="flex items-center gap-3 p-3 rounded-lg border border-neutral-border bg-slate-50/50 hover:bg-slate-50 cursor-pointer transition-colors">
                    <input type="checkbox" th:field="*{actif}" class="w-5 h-5 text-cobalt-700 rounded focus:ring-cobalt-700">
                    <div>
                        <span class="block text-sm font-bold text-slate-800">Régime actif</span>
                        <span class="block text-[11px] text-slate-500">Disponible pour les affectations</span>
                    </div>
                </label>
            </div>
        </div>

        <div class="flex justify-end gap-3">
            <a th:href="@{/temps-travail/regimes}"
               class="h-10 px-4 flex items-center rounded bg-surface-card border border-neutral-border text-slate-700 text-sm font-semibold hover:bg-slate-50 transition-colors">
                Annuler
            </a>
            <button type="submit"
                    class="h-10 px-6 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white text-sm font-semibold shadow-sm flex items-center gap-2 transition-colors">
                <span class="material-symbols-outlined text-[18px]">save</span>
                Enregistrer
            </button>
        </div>
    </form>

    <!-- 4. HORAIRES PAR JOUR (CALENDRIER) -->
    <div th:if="${regime.id != null}"
         class="bg-surface-card rounded-lg border border-neutral-border overflow-hidden shadow-sm">

        <div class="px-5 py-4 border-b border-neutral-border bg-slate-50 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px] text-cobalt-700">calendar_view_week</span>
                <h2 class="font-bold text-cobalt-900 uppercase tracking-wider text-sm m-0">Horaires par jour</h2>
            </div>
            <span class="text-xs text-slate-500 font-bold bg-white px-2 py-1 rounded border border-slate-200 shadow-sm"
                  th:text="${horairesParJour != null ? horairesParJour.size() : 0} + ' / 5 jour(s)'"></span>
        </div>

        <div class="p-5 overflow-x-auto">
            <!-- Calendrier -->
            <div class="min-w-[700px] flex">
                
                <!-- Colonne de l'axe Y (Heures) -->
                <div class="w-16 shrink-0">
                    <!-- Espace vide pour aligner avec l'en-tête des jours -->
                    <div class="h-10 bg-slate-50 border-b border-r border-slate-200"></div>
                    
                    <!-- Les heures -->
                    <div class="h-[585px] flex flex-col border-r border-slate-200 bg-slate-50 relative z-10">
                        <!-- On boucle de 7 à 19 (13 itérations) -->
                        <div th:each="h : ${#numbers.sequence(7, 19)}" class="h-[45px] relative">
                            <!-- Pastille blanche pour rendre l'heure lisible -->
                            <span class="absolute right-2 -top-2.5 text-[10px] font-mono text-slate-500 font-bold bg-white border border-slate-200 px-1.5 py-0.5 rounded shadow-sm z-20" 
                                  th:text="${h} + ':00'">
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Grille des jours -->
                <div class="flex-1 flex">
                    <div th:each="jour : ${jours}"
                         th:with="horaire=${horairesParJour != null ? horairesParJour[jour.key] : null}"
                         class="flex-1 border-r border-slate-200 last:border-r-0 relative">

                        <!-- En-tête du jour (Sticky) -->
                        <button type="button"
                                th:data-dayweek="${jour.key}"
                                th:data-debut="${horaire != null and horaire.heureDebut != null ? #temporals.format(horaire.heureDebut, 'HH:mm') : ''}"
                                th:data-fin="${horaire != null and horaire.heureFin != null ? #temporals.format(horaire.heureFin, 'HH:mm') : ''}"
                                th:data-pause="${horaire != null and horaire.pauseMinutes != null ? horaire.pauseMinutes : 60}"
                                onclick="openFromDataset(this)"
                                class="w-full h-10 bg-slate-50 border-b border-slate-200 flex items-center justify-center gap-2 hover:bg-slate-100 transition-colors">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-700" th:text="${#strings.substring(jour.value, 0, 3)}"></span>
                            <span class="w-2 h-2 rounded-full" th:classappend="${horaire != null ? 'bg-emerald-500' : 'bg-slate-300'}"></span>
                        </button>

                        <!-- Corps de la journée -->
                        <div class="relative h-[585px] bg-[linear-gradient(to_bottom,#f1f5f9_1px,transparent_1px)] bg-[size:100%_45px]">
                            
                            <!-- Overlay invisible pour rendre toute la colonne cliquable (si pas d'horaire) -->
                            <div class="absolute inset-0 z-0" 
                                 th:data-dayweek="${jour.key}"
                                 th:data-debut="${horaire != null and horaire.heureDebut != null ? #temporals.format(horaire.heureDebut, 'HH:mm') : ''}"
                                 th:data-fin="${horaire != null and horaire.heureFin != null ? #temporals.format(horaire.heureFin, 'HH:mm') : ''}"
                                 th:data-pause="${horaire != null and horaire.pauseMinutes != null ? horaire.pauseMinutes : 60}"
                                 onclick="openFromDataset(this)">
                            </div>

                            <!-- Le bloc coloré -->
                            <button type="button"
                                    th:if="${horaire != null and horaire.heureDebut != null and horaire.heureFin != null}"
                                    th:data-dayweek="${jour.key}"
                                    th:data-debut="${#temporals.format(horaire.heureDebut, 'HH:mm')}"
                                    th:data-fin="${#temporals.format(horaire.heureFin, 'HH:mm')}"
                                    th:data-pause="${horaire.pauseMinutes}"
                                    onclick="openFromDataset(this)"
                                    class="horaire-block absolute z-10 left-1 right-1 bg-cobalt-600/95 backdrop-blur-sm hover:bg-cobalt-700 text-white rounded-md shadow-md text-xs font-semibold p-2 text-left transition-all border-l-4 border-cobalt-800 flex flex-col justify-between overflow-hidden">
                                
                                <div class="truncate leading-tight" th:text="${#temporals.format(horaire.heureDebut, 'HH:mm') + ' - ' + #temporals.format(horaire.heureFin, 'HH:mm')}"></div>
                                <div class="text-[10px] text-cobalt-100 font-medium mt-1 truncate" th:text="${horaire.pauseMinutes + ' min pause'}"></div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- DIALOG PARTAGÉ -->
    <dialog id="horaireDialog"
            class="rounded-lg shadow-xl border border-neutral-border bg-surface-card w-full max-w-md p-0 backdrop:bg-slate-900/50">
        <form id="horaireForm" th:action="@{/temps-travail/regimes/{id}/horaires(id=${regime.id})}" method="post">
            <div class="px-5 py-4 border-b border-neutral-border bg-slate-50 flex items-center justify-between">
                <h3 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider">
                    Horaire — <span id="dialogJourLabel"></span>
                </h3>
                <button type="button" class="text-slate-400 hover:text-slate-700 text-xl leading-none px-2"
                        onclick="document.getElementById('horaireDialog').close()">
                    &times;
                </button>
            </div>
            
            <input type="hidden" name="dayweek" id="dialogDayweek">
            
            <div class="p-5 flex flex-col gap-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] uppercase tracking-wider text-slate-500 font-bold mb-2">Heure de début</label>
                        <input type="time" name="heureDebut" id="dialogDebut" required
                               class="w-full h-10 border border-neutral-border rounded px-3 text-sm font-mono focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                    </div>
                    <div>
                        <label class="block text-[11px] uppercase tracking-wider text-slate-500 font-bold mb-2">Heure de fin</label>
                        <input type="time" name="heureFin" id="dialogFin" required
                               class="w-full h-10 border border-neutral-border rounded px-3 text-sm font-mono focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-slate-500 font-bold mb-2">Pause (minutes)</label>
                    <input type="number" name="pauseMinutes" id="dialogPause" min="0" value="60"
                           class="w-full h-10 border border-neutral-border rounded px-3 text-sm font-mono focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                </div>
            </div>
            <div class="px-5 py-3 border-t border-neutral-border bg-slate-50 flex justify-end gap-2">
                <button type="button"
                        class="px-4 h-9 rounded border border-neutral-border text-slate-700 text-sm font-semibold hover:bg-slate-50"
                        onclick="document.getElementById('horaireDialog').close()">
                    Annuler
                </button>
                <button type="submit"
                        class="px-4 h-9 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white text-sm font-semibold shadow-sm">
                    Enregistrer
                </button>
            </div>
        </form>
    </dialog>

    <script>
        // 1. Gestion du Switch Coulissant
        function setDecompteType(isJours, isInitial = false) {
            const slider = document.getElementById('toggle-slider');
            const checkbox = document.getElementById('forfaitJours');
            const btnHeures = document.getElementById('btn-heures');
            const btnJours = document.getElementById('btn-jours');
            const blocHeures = document.getElementById('bloc-heures');
            const blocJours = document.getElementById('bloc-jours');

            if(!slider) return;

            // Mise à jour du champ caché pour Spring
            if(checkbox) checkbox.checked = isJours;

            // Animation du slider
            if(isInitial) slider.style.transition = 'none';
            else slider.style.transition = 'transform 300ms ease-in-out';

            if(isJours) {
                slider.style.transform = 'translateX(100%)';
                btnJours.classList.add('text-cobalt-900');
                btnJours.classList.remove('text-slate-500');
                btnHeures.classList.add('text-slate-500');
                btnHeures.classList.remove('text-cobalt-900');
                if(blocJours) blocJours.classList.remove('hidden');
                if(blocHeures) blocHeures.classList.add('hidden');
            } else {
                slider.style.transform = 'translateX(0)';
                btnHeures.classList.add('text-cobalt-900');
                btnHeures.classList.remove('text-slate-500');
                btnJours.classList.add('text-slate-500');
                btnJours.classList.remove('text-cobalt-900');
                if(blocHeures) blocHeures.classList.remove('hidden');
                if(blocJours) blocJours.classList.add('hidden');
            }

            // Si c'est l'initialisation, on force le navigateur à recalculer sans animation
            if(isInitial) {
                void slider.offsetWidth;
                slider.style.transition = 'transform 300ms ease-in-out';
            }
        }

        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            const isJours = document.getElementById('forfaitJours') && document.getElementById('forfaitJours').checked;
            setDecompteType(isJours, true);
        });


        // 2. Dialog horaire
        function openHoraireDialog(dayweek, debut, fin, pause) {
            document.getElementById('dialogDayweek').value = dayweek;
            document.getElementById('dialogDebut').value = debut || '09:00';
            document.getElementById('dialogFin').value = fin || '17:00';
            document.getElementById('dialogPause').value = pause || 60;
            
            const nomsJours = {1: 'Lundi', 2: 'Mardi', 3: 'Mercredi', 4: 'Jeudi', 5: 'Vendredi'};
            document.getElementById('dialogJourLabel').textContent = nomsJours[dayweek] || 'Jour';
            
            document.getElementById('horaireDialog').showModal();
        }

        function openFromDataset(btn) {
            openHoraireDialog(btn.dataset.dayweek, btn.dataset.debut, btn.dataset.fin, btn.dataset.pause);
        }

        // 3. Positionnement des blocs horaires dans le calendrier
        document.addEventListener('DOMContentLoaded', function () {
            const blocs = document.querySelectorAll('.horaire-block');

            blocs.forEach(function (btn) {
                const debut = btn.dataset.debut;
                const fin = btn.dataset.fin;

                if (!debut || !fin) return;

                const [hDebut, mDebut] = debut.split(':').map(Number);
                const [hFin, mFin] = fin.split(':').map(Number);

                let startMinutes = hDebut * 60 + mDebut;
                let endMinutes = hFin * 60 + mFin;

                if (endMinutes < startMinutes) endMinutes += 24 * 60;

                // 1 heure = 45px, donc 1 minute = 0.75px
                const PIXELS_PAR_MINUTE = 45 / 60;
                const AXE_DEBUT_MINUTES = 7 * 60; // L'axe commence à 7h00
                const AXE_FIN_MINUTES = 20 * 60;  // L'axe se termine à 20h00

                let topPx = (startMinutes - AXE_DEBUT_MINUTES) * PIXELS_PAR_MINUTE;
                let heightPx = (endMinutes - startMinutes) * PIXELS_PAR_MINUTE;

                if (startMinutes < AXE_DEBUT_MINUTES) {
                    heightPx -= (AXE_DEBUT_MINUTES - startMinutes) * PIXELS_PAR_MINUTE;
                    topPx = 0;
                }
                if (endMinutes > AXE_FIN_MINUTES) {
                    heightPx -= (endMinutes - AXE_FIN_MINUTES) * PIXELS_PAR_MINUTE;
                }

                if (heightPx < 0) heightPx = 0;

                btn.style.top = topPx + 'px';
                btn.style.height = heightPx + 'px';
            });
        });
    </script>

</main>
</body>
</html>
