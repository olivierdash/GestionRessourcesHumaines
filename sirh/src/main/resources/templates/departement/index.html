<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 class="font-headline-xl text-headline-xl text-on-surface font-bold">Départements</h2>
                <p class="text-sm text-on-surface-variant mt-1">Gérez la structure de l'entreprise.</p>
            </div>
            <a th:href="@{/departements/create}" 
               class="inline-flex items-center gap-2 h-10 px-4 rounded-lg bg-primary text-on-primary hover:bg-primary-container transition-colors shadow-sm font-medium text-sm">
                <span class="material-symbols-outlined text-[18px]">add</span>
                Nouveau Département
            </a>
        </div>

        <!-- Tableau -->
        <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container-high overflow-hidden">
            <div class="overflow-x-auto">
                <table class="sirh-table">
                    <thead>
                        <tr>
                            <th scope="col" class="w-2/5">Nom du département</th>
                            <th scope="col" class="w-1/3">Manager</th>
                            <th scope="col" class="w-1/4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Ligne vide -->
                        <tr th:if="${#lists.isEmpty(departements)}">
                            <td colspan="3" class="td-empty">
                                Aucun département n'a été créé pour le moment.
                            </td>
                        </tr>

                        <!-- Boucle -->
                        <tr th:each="dept : ${departements}">
                            <td class="font-semibold text-on-surface text-base" th:text="${dept.titre}"></td>
                            
                            <td>
                                <div th:if="${dept.manager != null}" class="flex items-center gap-2">
                                    <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs">
                                        <span th:text="${#strings.substring(dept.manager.nom, 0, 1)}">J</span>
                                    </div>
                                    <span class="font-medium text-on-surface" th:text="${dept.manager.nom}"></span>
                                </div>
                                <span th:if="${dept.manager == null}" class="inline-flex px-2.5 py-1 rounded-full bg-surface-container text-outline text-xs font-semibold">
                                    Non assigné
                                </span>
                            </td>
                            
                            <td class="text-right whitespace-nowrap">
                                <a th:href="@{/departements/{id}(id=${dept.idDepartement})}" 
                                   class="inline-flex items-center justify-center h-8 px-3 rounded-lg bg-surface-container text-on-surface hover:bg-surface-container-high font-medium text-xs transition-colors border border-surface-container-high">
                                    Voir
                                </a>
                                <a th:href="@{/departements/{id}/edit(id=${dept.idDepartement})}" 
                                   class="inline-flex items-center justify-center h-8 px-3 rounded-lg bg-primary text-on-primary hover:bg-primary-container font-medium text-xs transition-colors shadow-sm ml-2">
                                    Modifier
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</body>
</html>
