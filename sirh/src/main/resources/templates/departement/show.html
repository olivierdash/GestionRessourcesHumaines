<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="p-6 md:p-8 max-w-7xl mx-auto flex flex-col gap-6 w-full">

        <!-- En-tête -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 class="text-2xl font-bold text-cobalt-900 tracking-tight flex flex-wrap items-center gap-3">
                    <span th:text="${departement.titre}"></span>
                    <span class="px-2.5 py-1 bg-slate-100 border border-slate-200 text-cobalt-800 font-mono text-sm rounded font-bold"
                          th:text="'#' + ${departement.idDepartement}">
                    </span>
                </h2>
            </div>
            <div>
                <a th:href="@{/departements/{id}/edit(id=${departement.idDepartement})}" 
                   class="inline-flex items-center gap-1.5 px-4 h-9 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white transition-colors shadow-sm font-semibold text-xs">
                    <span class="material-symbols-outlined text-[16px]">edit</span>
                    Modifier
                </a>
            </div>
        </div>

        <!-- Contenu principal (Grille 2 colonnes) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Colonne de gauche (Infos) -->
            <div class="lg:col-span-2">
                <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border h-full overflow-hidden">
                    <div class="px-5 py-4 border-b border-neutral-border bg-slate-50">
                        <h3 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider">Informations du département</h3>
                    </div>
                    <div class="p-6">
                        
                        <div class="mb-6">
                            <span class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Titre du département</span>
                            <div class="text-lg font-bold text-cobalt-900" th:text="${departement.titre}"></div>
                        </div>

                        <hr class="my-6 border-neutral-border">

                        <div class="mb-6">
                            <span class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">Manager assigné</span>
                            
                            <div th:if="${departement.manager != null}" class="bg-slate-50 border border-neutral-border rounded p-4 flex items-center gap-4">
                                <div class="w-10 h-10 rounded bg-cobalt-900 text-white flex items-center justify-center font-bold text-base shadow-sm">
                                    <span th:text="${#strings.substring(departement.manager.nom, 0, 1)}"></span>
                                </div>
                                <div>
                                    <div class="font-bold text-slate-800 text-sm" th:text="${departement.manager.nom}"></div>
                                    <div class="text-xs text-slate-500" th:text="${departement.manager.email}"></div>
                                </div>
                            </div>

                            <div th:if="${departement.manager == null}" class="p-3 rounded bg-amber-50 text-amber-800 border border-amber-200 text-xs font-semibold">
                                Aucun manager n'est actuellement assigné à ce département.
                            </div>
                        </div>

                        <div>
                            <span class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Effectif actuel</span>
                            <div class="text-sm font-semibold text-slate-700">
                                <span th:text="${nombreEmployes}"></span> employé(s) dans ce département
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Colonne de droite (Actions) -->
            <div class="lg:col-span-1">
                <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border h-full overflow-hidden">
                    <div class="px-5 py-4 border-b border-neutral-border bg-slate-50">
                        <h3 class="text-sm font-bold text-cobalt-900 uppercase tracking-wider">Actions rapides</h3>
                    </div>
                    <div class="p-5 flex flex-col gap-3">
                        <a th:href="@{/employes(idDepartement=${departement.idDepartement})}" 
                           class="w-full flex items-center justify-start h-9 px-4 rounded bg-surface-card border border-neutral-border text-slate-700 hover:bg-slate-50 font-semibold text-xs transition-colors shadow-sm">
                            Accéder à la liste des employés
                        </a>
                        <a th:href="@{/demandes}" 
                           class="w-full flex items-center justify-start h-9 px-4 rounded bg-surface-card border border-neutral-border text-slate-700 hover:bg-slate-50 font-semibold text-xs transition-colors shadow-sm">
                            Voir les demandes de recrutement
                        </a>
                    </div>
                </div>
            </div>
            
        </div>

    </main>
</body>
</html>
