<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>

    <main th:fragment="mainContent" class="w-full flex flex-col gap-6">

        <!-- En-tête -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-2">
            <div>
                <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight">Onboarding</h1>
                <p class="text-sm text-slate-600 mt-1">Suivi de l'intégration du salarié.</p>
            </div>
            <a th:href="@{/employes/{id}(id=${idEmploye})}" class="inline-flex items-center gap-1.5 px-4 h-9 rounded bg-surface-card border border-neutral-border text-slate-700 hover:bg-slate-50 font-semibold text-xs shadow-sm transition-colors">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                Retour à la fiche
            </a>
        </div>

        <!-- Messages Flash -->
        <div th:if="${succes}" class="p-4 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-sm font-semibold shadow-sm" th:text="${succes}"></div>
        <div th:if="${erreur}" class="p-4 rounded bg-red-50 text-red-600 border border-red-200 text-sm font-semibold shadow-sm" th:text="${erreur}"></div>

        <!-- Barre de progression -->
        <div class="bg-surface-card border border-neutral-border rounded-lg p-5 shadow-sm">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Progression de l'intégration</span>
                <span class="text-sm font-bold text-cobalt-900" th:text="${progression} + ' %'"></span>
            </div>
            <div class="w-full bg-slate-100 border border-slate-200 rounded-full h-3 overflow-hidden">
                <div class="bg-cobalt-700 h-full rounded-full transition-all duration-500 ease-out" 
                     role="progressbar" 
                     th:style="'width: ' + ${progression} + '%;'">
                </div>
            </div>
        </div>

        <!-- Tableau -->
        <div class="bg-surface-card rounded-lg shadow-sm border border-neutral-border overflow-hidden flex flex-col">
            <div class="overflow-x-auto">
                <table class="sirh-table">
                    <thead>
                        <tr>
                            <th scope="col" class="w-64">Document</th>
                            <th scope="col">Tâche</th>
                            <th scope="col">Responsable</th>
                            <th scope="col">Échéance</th>
                            <th scope="col" class="text-center">Obligatoire</th>
                            <th scope="col">Statut</th>
                            <th scope="col" class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(taches)}">
                            <td colspan="7" class="td-empty py-8 text-center text-slate-500 italic">
                                Aucune tâche d'onboarding enregistrée.
                            </td>
                        </tr>
                        
                        <tr th:each="t : ${taches}">
                            <!-- Formulaire de dépôt de document -->
                            <td class="align-top min-w-[240px] py-3">
                                <form th:action="@{/onboarding/taches/{id}/documents(id=${t.id})}" method="post" enctype="multipart/form-data" class="flex flex-col gap-2 m-0">
                                    <input type="hidden" name="idEmploye" th:value="${idEmploye}">

                                    <select name="idTypeDocument" required
                                            class="w-full h-8 px-2 bg-white border border-neutral-border rounded text-xs text-slate-800 focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700 transition-colors cursor-pointer">
                                        <option th:each="td : ${typesDocument}" th:value="${td.idTypeDocument}" th:text="${td.libelle}"></option>
                                    </select>

                                    <input type="file" name="fichier" required
                                           class="block w-full text-[11px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[11px] file:font-bold file:bg-cobalt-50 file:text-cobalt-700 hover:file:bg-cobalt-100 cursor-pointer border border-neutral-border rounded">
                                    
                                    <button type="submit" class="h-8 px-3 rounded bg-surface-card border border-neutral-border text-cobalt-700 hover:bg-slate-50 font-semibold text-xs transition-colors shadow-sm w-full">
                                        Déposer
                                    </button>
                                </form>
                            </td>
                            
                            <td class="font-bold text-cobalt-900 text-sm" th:text="${t.titre}"></td>
                            <td class="text-slate-600 text-sm" th:text="${t.responsable.nom}"></td>
                            <td class="text-slate-600 font-mono text-xs whitespace-nowrap" th:text="${#temporals.format(t.dateEcheance, 'dd/MM/yyyy')}"></td>
                            <td class="text-center">
                                <span class="inline-flex items-center px-2 py-0.5 rounded border text-[10px] font-bold uppercase tracking-wider"
                                      th:classappend="${t.obligatoire} ? 'bg-red-50 border-red-200 text-red-700' : 'bg-slate-100 border-slate-200 text-slate-600'"
                                      th:text="${t.obligatoire} ? 'Oui' : 'Non'">
                                </span>
                            </td>
                            <td>
                                <span class="inline-flex items-center px-2 py-0.5 rounded border text-[10px] font-bold uppercase tracking-wider"
                                      th:classappend="${t.statut.libelle == 'terminée' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-amber-50 border-amber-200 text-amber-700'}"
                                      th:text="${t.statut.libelle}">
                                </span>
                            </td>
                            <td class="text-right align-top py-3">
                                <form th:if="${t.statut.libelle != 'terminée'}"
                                      th:action="@{/onboarding/taches/{id}/terminer(id=${t.id})}"
                                      method="post" class="m-0">
                                    <input type="hidden" name="idEmploye" th:value="${idEmploye}">
                                    <button type="submit" class="h-7 px-3 rounded bg-emerald-600 text-white hover:bg-emerald-700 font-semibold text-xs transition-colors shadow-sm flex items-center gap-1 ml-auto">
                                        <span class="material-symbols-outlined text-[14px]">check</span>
                                        Terminer
                                    </button>
                                </form>
                                <span th:if="${t.statut.libelle == 'terminée'}" class="text-xs text-slate-400 italic">Terminée</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</body>
</html>
