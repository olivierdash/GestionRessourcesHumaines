<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" 
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>
    <main th:fragment="mainContent" class="w-full flex flex-col gap-6">
        
        <!-- Métriques Clés (Cartes KPI) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-3">
            <!-- Carte 1 -->
            <div class="bg-surface-card p-5 border border-neutral-border shadow-sm flex flex-col justify-center h-32 rounded-lg">
                <div class="flex items-start justify-between">
                    <div class="flex flex-col">
                        <span class="text-[11px] uppercase tracking-wider text-muted-text font-bold">Demandes à valider</span>
                        <span class="text-3xl font-extrabold text-cobalt-900 mt-1" th:text="${dashboard.demandesEnCours}">0</span>
                    </div>
                    <div class="w-9 h-9 border border-neutral-border bg-slate-50 flex items-center justify-center text-cobalt-800 rounded">
                        <span class="material-symbols-outlined text-[20px]">assignment_turned_in</span>
                    </div>
                </div>
            </div>

            <!-- Carte 2 -->
            <div class="bg-surface-card p-5 border border-neutral-border shadow-sm flex flex-col justify-center h-32 rounded-lg">
                <div class="flex items-start justify-between">
                    <div class="flex flex-col">
                        <span class="text-[11px] uppercase tracking-wider text-muted-text font-bold">Postes ouverts</span>
                        <span class="text-3xl font-extrabold text-cobalt-900 mt-1" th:text="${dashboard.postesOuverts}">0</span>
                    </div>
                    <div class="w-9 h-9 border border-neutral-border bg-slate-50 flex items-center justify-center text-cobalt-800 rounded">
                        <span class="material-symbols-outlined text-[20px]">work</span>
                    </div>
                </div>
            </div>

            <!-- Carte 3 -->
            <div class="bg-surface-card p-5 border border-neutral-border shadow-sm flex flex-col justify-center h-32 rounded-lg">
                <div class="flex items-start justify-between">
                    <div class="flex flex-col">
                        <span class="text-[11px] uppercase tracking-wider text-muted-text font-bold">Candidatures (7j)</span>
                        <span class="text-3xl font-extrabold text-cobalt-900 mt-1" th:text="${dashboard.candidaturesSemaine}">0</span>
                    </div>
                    <div class="w-9 h-9 border border-neutral-border bg-slate-50 flex items-center justify-center text-cobalt-800 rounded">
                        <span class="material-symbols-outlined text-[20px]">group_add</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Visualisation Flux (Pleine largeur) -->
        <div class="w-full bg-surface-card p-5 border border-neutral-border shadow-sm flex flex-col justify-between rounded-lg">
            <div class="flex items-center justify-between pb-4 border-b border-neutral-border mb-3">
                <div>
                    <h2 class="text-base font-bold text-cobalt-900 tracking-tight">Évolution des candidatures</h2>
                    <p class="text-xs text-slate-600 mt-0.5">Fréquence journalière consolidée sur les 30 derniers jours</p>
                </div>
            </div>
            
            <!-- Trame Graphique -->
            <div class="relative w-full h-72 bg-slate-50 border border-neutral-border flex items-end p-4 rounded-sm">
                <canvas id="evolutionChart"></canvas>
            </div>
            
            <div class="flex justify-between items-center pt-3 text-muted-text text-[11px] font-mono font-medium">
                <span>J-30</span>
                <span>J-24</span>
                <span>J-18</span>
                <span>J-12</span>
                <span>J-6</span>
                <span class="text-cobalt-900 font-bold">Aujourd'hui</span>
            </div>
        </div>
     <!-- Script Chart.js -->
    <script th:src="@{/js/chart.umd.js}"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const chartData = /*[[${dashboard.chartData}]]*/ [];
            
            const labels = chartData.map(d => {
                const parts = d.date.split('-');
                return `${parts[2]}/${parts[1]}`;
            });
            const dataPoints = chartData.map(d => d.count);

            const ctx = document.getElementById('evolutionChart').getContext('2d');
            
            let gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(30, 64, 175, 0.18)');
            gradient.addColorStop(1, 'rgba(30, 64, 175, 0.01)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Candidatures',
                        data: dataPoints,
                        borderColor: '#1E40AF',
                        backgroundColor: gradient,
                        borderWidth: 2.5,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#1E40AF',
                        pointBorderWidth: 2,
                        pointRadius: 3,
                        tension: 0,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1, color: '#64748b', font: { family: 'Inter', size: 11 } },
                            grid: { color: '#cbd5e1', borderDash: [2, 3], drawBorder: false }
                        },
                        x: {
                            ticks: { color: '#64748b', font: { family: 'Inter', size: 11 } },
                            grid: { display: false }
                        }
                    }
                }
            });
        });
    </script>
    </main>

   
</body>
</html>
