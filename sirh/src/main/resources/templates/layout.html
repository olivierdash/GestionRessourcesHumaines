<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr"
    th:fragment="layout(content)">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SIRH Pro</title>

    <!-- CSS compilé (Sass + Tailwind) : polices locales, Tailwind et styles personnalisés -->
    <script th:src="@{/js/tailwind.js}"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cobalt: {
                            950: "#0f172a", 900: "#1e3a8a", 800: "#1e40af",
                            700: "#1d4ed8", 600: "#2563eb", 500: "#3b82f6", 50: "#eff6ff"
                        },
                        "neutral-border": "#e2e8f0",
                        "surface-bg": "#f8fafc",
                        "surface-card": "#ffffff",
                        "body-text": "#1e293b",
                        "muted-text": "#64748b"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.375rem",
                        full: "0.5rem"
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        /* --- Règles pour la Sidebar Rétractable --- */
        #sidebar {
            transition: width 0.3s ease;
            overflow: hidden;
        }

        #main-content {
            transition: margin-left 0.3s ease;
        }

        /* État réduit */
        body.sidebar-collapsed #sidebar {
            width: 4.5rem;
            /* 72px */
        }

        body.sidebar-collapsed #main-content {
            margin-left: 4.5rem;
        }

        /* Cache les textes */
        body.sidebar-collapsed .sidebar-text {
            display: none;
        }

        /* Centre les icônes */
        body.sidebar-collapsed .sidebar-nav-link {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
            border-left-width: 0;
            margin: 0 0.5rem;
        }

        /* Profil */
        body.sidebar-collapsed .sidebar-profile-text,
        body.sidebar-collapsed .sidebar-logout-btn {
            display: none;
        }

        body.sidebar-collapsed .sidebar-profile-container {
            padding: 0.5rem;
            justify-content: center;
        }
    </style>
</head>

<body class="bg-surface-bg font-sans text-sm text-body-text antialiased h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar"
        class="fixed left-0 top-0 h-screen w-64 bg-surface-card border-r border-neutral-border z-50 flex flex-col justify-between">

        <div class="flex flex-col h-full min-h-0">

            <!-- Espace réservé pour l'alignement avec la Topbar -->
            <div class="h-14 shrink-0 border-b border-neutral-border"></div>

            <!-- Menu -->
            <nav class="px-2 pt-4 flex flex-col gap-1 overflow-y-auto flex-1">

                <!-- Lien Actif -->
                <a sec:authorize="!hasRole('ADMIN')" th:href="@{/utilisateur/dashboard}"
                    class="sidebar-nav-link flex items-center gap-3 px-3 py-2 border-l-4 border-cobalt-800 bg-slate-100 text-cobalt-900 font-semibold text-sm transition-colors"
                    title="Tableau de bord">
                    <span class="material-symbols-outlined text-[20px] text-cobalt-800 shrink-0">grid_view</span>
                    <span class="sidebar-text whitespace-nowrap">Tableau de bord</span>
                </a>

                <a sec:authorize="hasAnyRole('ADMIN')" th:href="@{/admin/utilisateurs}"
                    class="sidebar-nav-link flex items-center gap-3 px-3 py-2 border-l-4 border-transparent text-slate-700 font-medium text-sm hover:bg-slate-50 hover:text-cobalt-900 transition-colors"
                    title="Utilisateurs">
                    <span class="material-symbols-outlined text-[20px] text-slate-500 shrink-0">manage_accounts</span>
                    <span class="sidebar-text whitespace-nowrap">Utilisateurs</span>
                </a>

                <a sec:authorize="hasAnyRole('MANAGER', 'RH')" th:href="@{/demandes}"
                    class="sidebar-nav-link flex items-center gap-3 px-3 py-2 border-l-4 border-transparent text-slate-700 font-medium text-sm hover:bg-slate-50 hover:text-cobalt-900 transition-colors"
                    title="Demandes">
                    <span class="material-symbols-outlined text-[20px] text-slate-500 shrink-0">assignment</span>
                    <span class="sidebar-text whitespace-nowrap">Demandes</span>
                </a>

                <a sec:authorize="hasAnyRole('MANAGER', 'RH', 'DG')" th:href="@{/employes}"
                    class="sidebar-nav-link flex items-center gap-3 px-3 py-2 border-l-4 border-transparent text-slate-700 font-medium text-sm hover:bg-slate-50 hover:text-cobalt-900 transition-colors"
                    title="Employés">
                    <span class="material-symbols-outlined text-[20px] text-slate-500 shrink-0">group</span>
                    <span class="sidebar-text whitespace-nowrap">Employés</span>
                </a>

                <a sec:authorize="hasAnyRole('RH', 'DG')" th:href="@{/departements}"
                    class="sidebar-nav-link flex items-center gap-3 px-3 py-2 border-l-4 border-transparent text-slate-700 font-medium text-sm hover:bg-slate-50 hover:text-cobalt-900 transition-colors"
                    title="Départements">
                    <span class="material-symbols-outlined text-[20px] text-slate-500 shrink-0">domain</span>
                    <span class="sidebar-text whitespace-nowrap">Départements</span>
                </a>

                <a sec:authorize="hasAnyRole('RH', 'FINANCE', 'DG')" th:href="@{/postes}"
                    class="sidebar-nav-link flex items-center gap-3 px-3 py-2 border-l-4 border-transparent text-slate-700 font-medium text-sm hover:bg-slate-50 hover:text-cobalt-900 transition-colors"
                    title="Postes">
                    <span class="material-symbols-outlined text-[20px] text-slate-500 shrink-0">work</span>
                    <span class="sidebar-text whitespace-nowrap">Postes</span>
                </a>

                <a sec:authorize="hasAnyRole('RH', 'FINANCE', 'DG')" th:href="@{/grilles}"
                    class="sidebar-nav-link flex items-center gap-3 px-3 py-2 border-l-4 border-transparent text-slate-700 font-medium text-sm hover:bg-slate-50 hover:text-cobalt-900 transition-colors"
                    title="Grilles">
                    <span class="material-symbols-outlined text-[20px] text-slate-500 shrink-0">payments</span>
                    <span class="sidebar-text whitespace-nowrap">Grilles</span>
                </a>

                <a sec:authorize="hasAnyRole('RH', 'DG')" th:href="@{/offres}"
                    class="sidebar-nav-link flex items-center gap-3 px-3 py-2 border-l-4 border-transparent text-slate-700 font-medium text-sm hover:bg-slate-50 hover:text-cobalt-900 transition-colors"
                    title="Offres">
                    <span class="material-symbols-outlined text-[20px] text-slate-500 shrink-0">campaign</span>
                    <span class="sidebar-text whitespace-nowrap">Offres</span>
                </a>

                <a sec:authorize="hasAnyRole('FINANCE', 'DG', 'RH')" th:href="@{/demandes/validations}"
                    class="sidebar-nav-link flex items-center justify-between px-3 py-2 border-l-4 border-transparent text-slate-700 font-medium text-sm hover:bg-slate-50 hover:text-cobalt-900 transition-colors"
                    title="Validations">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-[20px] text-slate-500 shrink-0">fact_check</span>
                        <span class="sidebar-text whitespace-nowrap">Validations</span>
                    </div>
                    <span th:if="${validationsEnAttenteCount > 0}"
                        class="bg-cobalt-800 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full sidebar-text">
                        <span th:text="${validationsEnAttenteCount}"></span>
                    </span>
                </a>
            </nav>
        </div>

        <!-- Profil Utilisateur -->
        <div class="p-3 border-t border-neutral-border bg-surface-card shrink-0 sidebar-profile-container">
            <div
                class="flex items-center gap-3 p-2 hover:bg-slate-50 transition-colors cursor-pointer border border-transparent hover:border-neutral-border rounded">
                <div class="w-8 h-8 rounded bg-cobalt-900 flex items-center justify-center shrink-0 text-white font-bold text-xs"
                    th:text="${#strings.substring(#authentication.principal.utilisateur.nom, 0, 2)}"></div>
                <div class="flex flex-col min-w-0 flex-1 sidebar-profile-text">
                    <span class="font-semibold text-xs text-cobalt-900 truncate"
                        th:text="${#authentication.principal.utilisateur.nom}"></span>
                    <span class="text-[11px] text-muted-text truncate font-medium"
                        th:text="${#authentication.principal.utilisateur.role.libelle}"></span>
                </div>
                <form th:action="@{/logout}" method="post" class="m-0 flex items-center sidebar-logout-btn">
                    <button type="submit"
                        class="material-symbols-outlined text-slate-400 text-[18px] hover:text-red-600 transition-colors"
                        title="Déconnexion">logout</button>
                </form>
            </div>
        </div>
    </aside>

    <!-- CONTENU PRINCIPAL -->
    <div id="main-content" class="ml-64 flex flex-col h-screen min-h-0">

        <!-- TOPBAR -->
        <header
            class="h-14 shrink-0 bg-surface-card border-b border-neutral-border z-40 px-4 flex items-center justify-between">

            <!-- Bouton Hamburger -->
            <div class="flex items-center">
                <button id="sidebar-toggle" type="button"
                    class="w-9 h-9 flex items-center justify-center text-slate-500 hover:text-cobalt-900 hover:bg-slate-100 rounded transition-colors"
                    title="Rétracter le menu">
                    <span class="material-symbols-outlined text-[24px]">menu</span>
                </button>
            </div>

            <!-- Notifications & Profil -->
            <div class="flex items-center gap-4">
                <button
                    class="w-9 h-9 flex items-center justify-center border border-neutral-border rounded text-slate-700 hover:bg-slate-50 hover:text-cobalt-900 transition-colors relative"
                    type="button">
                    <span class="material-symbols-outlined text-[20px]">notifications</span>
                    <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-red-600 ring-2 ring-white"></span>
                </button>
                <div class="h-5 w-px bg-neutral-border"></div>
                <div
                    class="w-8 h-8 bg-cobalt-900 text-white flex items-center justify-center rounded border border-cobalt-950 font-semibold">
                    <span class="material-symbols-outlined text-[18px]">person</span>
                </div>
            </div>
        </header>

        <!-- ZONE D'INJECTION DYNAMIQUE -->
                <!-- ZONE D'INJECTION DYNAMIQUE -->
        <main class="flex-1 min-h-0 overflow-y-auto p-6 md:p-8 bg-surface-bg">
            <div class="max-w-7xl mx-auto w-full flex flex-col">
                <!-- Le Breadcrumb est injecté ici -->
                <div th:replace="~{fragments/breadcrumb :: breadcrumb}"></div>
                
                <!-- Le contenu de la page -->
                <div th:replace="${content}"></div>
            </div>
        </main>

    </div>

    <!-- SCRIPT POUR LA SIDEBAR -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('sidebar-toggle');
            const body = document.body;

            if (localStorage.getItem('sidebarState') === 'collapsed') {
                body.classList.add('sidebar-collapsed');
            }

            toggleBtn.addEventListener('click', () => {
                body.classList.toggle('sidebar-collapsed');

                if (body.classList.contains('sidebar-collapsed')) {
                    localStorage.setItem('sidebarState', 'collapsed');
                } else {
                    localStorage.setItem('sidebarState', 'expanded');
                }
            });
        });
    </script>
</body>

</html>
