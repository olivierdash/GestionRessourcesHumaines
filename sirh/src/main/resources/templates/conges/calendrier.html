<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>
<main th:fragment="mainContent" class="w-full flex flex-col gap-6">

    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight">Calendrier des congés</h1>
            <p class="text-sm text-slate-600 mt-1">Absences et demandes en attente sur le mois.</p>
        </div>
        <div class="flex items-center gap-2 self-start md:self-auto">
            <a th:href="@{/conges/calendrier(periode=${precedent})}"
               class="h-9 w-9 rounded bg-white border border-neutral-border text-slate-700 hover:bg-slate-50 flex items-center justify-center shadow-sm">
                <span class="material-symbols-outlined text-[18px]">chevron_left</span>
            </a>
            <span class="h-9 px-4 rounded bg-white border border-neutral-border text-sm font-semibold text-cobalt-900 flex items-center min-w-[10rem] justify-center"
                  th:text="${#temporals.format(debut, 'MMMM yyyy')}"></span>
            <a th:href="@{/conges/calendrier(periode=${suivant})}"
               class="h-9 w-9 rounded bg-white border border-neutral-border text-slate-700 hover:bg-slate-50 flex items-center justify-center shadow-sm">
                <span class="material-symbols-outlined text-[18px]">chevron_right</span>
            </a>
        </div>
    </div>

    <div class="flex flex-wrap items-center gap-4 text-[11px] text-slate-600">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> Absence</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Demande en attente</span>
        <span class="text-slate-400">·</span>
        <span th:text="${#lists.size(employes)} + ' salarié(s) dans votre périmètre'"></span>
    </div>

    <div class="bg-surface-card rounded-lg border border-neutral-border shadow-sm overflow-hidden">
        <table class="w-full table-fixed border-collapse">
            <thead>
                <tr class="bg-slate-50 border-b border-neutral-border">
                    <th class="py-2 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Lun</th>
                    <th class="py-2 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Mar</th>
                    <th class="py-2 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Mer</th>
                    <th class="py-2 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Jeu</th>
                    <th class="py-2 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Ven</th>
                    <th class="py-2 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Sam</th>
                    <th class="py-2 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">Dim</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="semaine : ${#numbers.sequence(0, semaines - 1)}"
                    class="border-b border-neutral-border last:border-0">
                    <td th:each="jourSemaine : ${#numbers.sequence(1, 7)}"
                        class="align-top p-1.5 h-28 border-r border-neutral-border last:border-r-0"
                        th:with="numeroJour=${semaine * 7 + jourSemaine - offset}">
                        <div th:if="${numeroJour >= 1 and numeroJour <= joursDansMois}"
                             th:with="jour=${debut.plusDays(numeroJour - 1)}"
                             class="h-full flex flex-col gap-1">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-slate-700" th:text="${numeroJour}"></span>
                                <span th:if="${jour.dayOfWeek.value > 5}" class="text-[9px] uppercase font-bold text-slate-300">WE</span>
                            </div>
                            <div class="flex flex-col gap-1 overflow-y-auto max-h-24">
                                <div th:each="a : ${absencesParJour[jour]}"
                                     class="px-1.5 py-0.5 rounded border border-red-200 bg-red-50">
                                    <div class="text-[10px] font-semibold text-red-800 truncate"
                                         th:text="${a.employe.candidature.candidat.prenom + ' ' + a.employe.candidature.candidat.nom}"></div>
                                    <div class="text-[9px] text-red-600 truncate"
                                         th:text="${a.typeConge.libelle + ' · ' + a.statut}"></div>
                                </div>
                                <div th:each="d : ${demandesParJour[jour]}"
                                     class="px-1.5 py-0.5 rounded border border-amber-200 bg-amber-50">
                                    <div class="text-[10px] font-semibold text-amber-800 truncate"
                                         th:text="${d.employe.candidature.candidat.prenom + ' ' + d.employe.candidature.candidat.nom}"></div>
                                    <div class="text-[9px] text-amber-600 truncate"
                                         th:text="${d.typeConge.libelle + ' · en attente'}"></div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <a th:href="@{/conges/validations}"
           class="bg-surface-card rounded-lg border border-neutral-border shadow-sm p-5 hover:border-cobalt-700 transition-colors">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-cobalt-700">fact_check</span>
                <div>
                    <div class="font-bold text-cobalt-900">File de validation</div>
                    <div class="text-xs text-slate-500">Traiter les demandes en attente.</div>
                </div>
            </div>
        </a>
        <a th:href="@{/conges/absences}"
           class="bg-surface-card rounded-lg border border-neutral-border shadow-sm p-5 hover:border-cobalt-700 transition-colors">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-cobalt-700">sick</span>
                <div>
                    <div class="font-bold text-cobalt-900">Absences</div>
                    <div class="text-xs text-slate-500">Consulter et justifier les absences.</div>
                </div>
            </div>
        </a>
    </div>
</main>
</body>
</html>
