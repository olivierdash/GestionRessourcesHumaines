<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>
<main th:fragment="mainContent" class="w-full flex flex-col gap-6">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight"
                th:text="${droit.id == null ? 'Nouvelle règle de droit' : 'Modifier la règle de droit'}"></h1>
            <p class="text-sm text-slate-600 mt-1">Le droit est calculé selon le contrat actif et l'ancienneté du salarié.</p>
        </div>
        <a th:href="@{/conges/droits}" class="text-sm text-cobalt-700 font-semibold flex items-center gap-1">
            <span class="material-symbols-outlined text-[16px]">arrow_back</span>
            Retour
        </a>
    </div>

    <div th:if="${errorMessage}" class="p-4 rounded bg-red-50 text-red-600 border border-red-200 text-sm font-semibold" th:text="${errorMessage}"></div>
    <div th:if="${errors != null and !errors.isEmpty()}" class="p-4 rounded bg-red-50 text-red-700 border border-red-200 text-sm font-semibold">
        <ul class="list-disc list-inside text-xs font-medium">
            <li th:each="e : ${errors}" th:text="${e.value}"></li>
        </ul>
    </div>

    <form th:action="@{/conges/droits}" method="post" th:object="${droit}"
          class="bg-surface-card rounded-lg border border-neutral-border shadow-sm p-6 flex flex-col gap-6">
        <input type="hidden" th:field="*{id}">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="idTypeConge" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Type de congé <span class="text-red-500">*</span></label>
                <select id="idTypeConge" th:field="*{idTypeConge}" required
                        class="w-full h-10 border border-neutral-border rounded px-3 text-sm bg-white focus:outline-none focus:border-cobalt-700">
                    <option value="">Sélectionner</option>
                    <option th:each="t : ${types}" th:value="${t.id}" th:text="${t.libelle + ' (' + t.code + ')'}"></option>
                </select>
                <p th:if="${errors != null and errors['typeConge'] != null}" th:text="${errors['typeConge']}" class="mt-1 text-xs text-red-500 font-semibold"></p>
            </div>
            <div>
                <label for="idTypeContrat" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Type de contrat</label>
                <select id="idTypeContrat" th:field="*{idTypeContrat}"
                        class="w-full h-10 border border-neutral-border rounded px-3 text-sm bg-white focus:outline-none focus:border-cobalt-700">
                    <option value="">Tous les contrats</option>
                    <option th:each="c : ${contrats}" th:value="${c.id}" th:text="${c.libelle}"></option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="ancienneteMinMois" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Ancienneté min. (mois)</label>
                <input id="ancienneteMinMois" type="number" min="0" th:field="*{ancienneteMinMois}"
                       class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700">
            </div>
            <div>
                <label for="ancienneteMaxMois" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Ancienneté max. (mois)</label>
                <input id="ancienneteMaxMois" type="number" min="0" th:field="*{ancienneteMaxMois}"
                       class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700"
                       placeholder="Sans limite">
            </div>
            <div>
                <label for="modeAcquisition" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Mode d'acquisition <span class="text-red-500">*</span></label>
                <select id="modeAcquisition" th:field="*{modeAcquisition}" required
                        class="w-full h-10 border border-neutral-border rounded px-3 text-sm bg-white focus:outline-none focus:border-cobalt-700">
                    <option th:each="m : ${modes}" th:value="${m}"
                            th:text="${m.name() == 'MENSUEL' ? 'Mensuelle (1/12 par mois)' : 'Annuelle'}"></option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="joursParAn" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Droit annuel (jours) <span class="text-red-500">*</span></label>
                <input id="joursParAn" type="number" min="0" step="0.5" th:field="*{joursParAn}" required
                       class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700">
                <p th:if="${errors != null and errors['joursParAn'] != null}" th:text="${errors['joursParAn']}" class="mt-1 text-xs text-red-500 font-semibold"></p>
            </div>
            <div class="flex flex-col gap-3 p-4 rounded bg-slate-50 border border-neutral-border justify-center">
                <label class="flex items-center gap-2 text-sm text-slate-700 font-semibold">
                    <input type="checkbox" th:field="*{prorataAnneeEmbauche}" class="rounded border-slate-300">
                    Prorata l'année d'embauche
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-700 font-semibold">
                    <input type="checkbox" th:field="*{actif}" class="rounded border-slate-300">
                    Règle active
                </label>
            </div>
        </div>

        <div>
            <label for="description" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Description</label>
            <textarea id="description" th:field="*{description}" rows="2" maxlength="500"
                      class="w-full border border-neutral-border rounded px-3 py-2 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700"></textarea>
        </div>

        <div class="p-3 rounded bg-slate-50 border border-neutral-border text-xs text-slate-600">
            Si plusieurs règles correspondent, la règle la plus spécifique (contrat renseigné) et l'ancienneté la plus élevée sont retenues.
        </div>

        <div class="flex items-center justify-end gap-2 pt-2 border-t border-neutral-border">
            <a th:href="@{/conges/droits}"
               class="h-10 px-5 rounded bg-white border border-neutral-border text-slate-700 hover:bg-slate-50 text-xs font-semibold flex items-center">
                Annuler
            </a>
            <button type="submit"
                    class="h-10 px-5 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white text-xs font-semibold shadow-sm">
                Enregistrer
            </button>
        </div>
    </form>
</main>
</body>
</html>
