<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>
<main th:fragment="mainContent" class="w-full flex flex-col gap-6">

    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight">Règles de droit à congé</h1>
            <p class="text-sm text-slate-600 mt-1">Barèmes configurables par type de congé, contrat et ancienneté.</p>
        </div>
        <div class="flex items-center gap-2 self-start md:self-auto">
            <a th:href="@{/conges/types}"
               class="h-9 px-4 rounded bg-white border border-neutral-border text-slate-700 hover:bg-slate-50 text-xs font-semibold flex items-center gap-1.5 shadow-sm">
                <span class="material-symbols-outlined text-[16px]">category</span>
                Types
            </a>
            <a th:href="@{/conges/droits/nouveau}"
               class="h-9 px-4 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm">
                <span class="material-symbols-outlined text-[16px]">add</span>
                Nouvelle règle
            </a>
        </div>
    </div>

    <div th:if="${succes}" class="p-4 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-sm font-semibold shadow-sm" th:text="${succes}"></div>
    <div th:if="${erreur}" class="p-4 rounded bg-red-50 text-red-600 border border-red-200 text-sm font-semibold shadow-sm" th:text="${erreur}"></div>

    <div class="bg-surface-card rounded-lg border border-neutral-border shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="sirh-table">
                <thead>
                    <tr>
                        <th>Type de congé</th>
                        <th>Contrat</th>
                        <th>Ancienneté</th>
                        <th>Acquisition</th>
                        <th>Droit annuel</th>
                        <th>Prorata embauche</th>
                        <th>Statut</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(droits)}">
                        <td colspan="8" class="td-empty py-8 text-center text-slate-500 italic">Aucune règle configurée.</td>
                    </tr>
                    <tr th:each="d : ${droits}">
                        <td>
                            <div class="font-bold text-cobalt-900" th:text="${d.typeConge.libelle}"></div>
                            <div class="font-mono text-[11px] text-slate-500" th:text="${d.typeConge.code}"></div>
                        </td>
                        <td class="text-sm" th:text="${d.typeContrat != null ? d.typeContrat.libelle : 'Tous les contrats'}"></td>
                        <td class="text-xs text-slate-600 whitespace-nowrap">
                            <span th:text="${d.ancienneteMinMois + ' mois'}"></span>
                            <span class="text-slate-400 mx-1">→</span>
                            <span th:text="${d.ancienneteMaxMois != null ? d.ancienneteMaxMois + ' mois' : 'sans limite'}"></span>
                        </td>
                        <td class="text-xs font-semibold"
                            th:text="${d.modeAcquisition.name() == 'MENSUEL' ? 'Mensuelle' : 'Annuelle'}"></td>
                        <td class="font-semibold text-cobalt-900"
                            th:text="${@formatDuree.jours(d.joursParAn) + ' / an'}"></td>
                        <td class="text-xs">
                            <span th:if="${d.prorataAnneeEmbauche}" class="text-emerald-700 font-semibold">Oui</span>
                            <span th:unless="${d.prorataAnneeEmbauche}" class="text-slate-400">Non</span>
                        </td>
                        <td>
                            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded border text-[10px] font-bold uppercase tracking-wider"
                                  th:classappend="${d.actif
                                      ? 'bg-emerald-50 border-emerald-200 text-emerald-700'
                                      : 'bg-slate-100 border-slate-200 text-slate-500'}">
                                <span class="w-1.5 h-1.5 rounded-full"
                                      th:classappend="${d.actif ? 'bg-emerald-500' : 'bg-slate-400'}"></span>
                                <span th:text="${d.actif ? 'Active' : 'Inactive'}"></span>
                            </span>
                        </td>
                        <td class="text-right whitespace-nowrap">
                            <a th:href="@{/conges/droits/{id}/edit(id=${d.id})}"
                               class="inline-flex items-center gap-1.5 h-7 px-3 rounded bg-white border border-slate-300 text-cobalt-700 hover:bg-slate-50 text-xs font-semibold">
                                <span class="material-symbols-outlined text-[14px]">edit</span>
                                Modifier
                            </a>
                            <form th:action="@{/conges/droits/{id}/basculer(id=${d.id})}" method="post" class="inline">
                                <button type="submit"
                                        class="inline-flex items-center h-7 px-3 rounded bg-white border text-xs font-semibold"
                                        th:classappend="${d.actif ? 'border-red-200 text-red-600 hover:bg-red-50' : 'border-emerald-200 text-emerald-700 hover:bg-emerald-50'}"
                                        th:text="${d.actif ? 'Désactiver' : 'Activer'}">
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
