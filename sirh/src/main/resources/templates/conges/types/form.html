<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>
<main th:fragment="mainContent" class="w-full flex flex-col gap-6">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight"
                th:text="${type.id == null ? 'Nouveau type de congé' : 'Modifier le type de congé'}"></h1>
            <p class="text-sm text-slate-600 mt-1">Les types utilisés ne peuvent pas être supprimés, seulement désactivés.</p>
        </div>
        <a th:href="@{/conges/types}" class="text-sm text-cobalt-700 font-semibold flex items-center gap-1">
            <span class="material-symbols-outlined text-[16px]">arrow_back</span>
            Retour
        </a>
    </div>

    <div th:if="${errorMessage}" class="p-4 rounded bg-red-50 text-red-600 border border-red-200 text-sm font-semibold" th:text="${errorMessage}"></div>
    <div th:if="${errors != null and !errors.isEmpty()}" class="p-4 rounded bg-red-50 text-red-700 border border-red-200 text-sm font-semibold">
        <ul class="list-disc list-inside text-xs font-medium">
            <li th:each="e : ${errors}" th:text="${e.value}"></li>
        </ul>
    </div>

    <form th:action="@{/conges/types}" method="post" th:object="${type}"
          class="bg-surface-card rounded-lg border border-neutral-border shadow-sm p-6 flex flex-col gap-6">
        <input type="hidden" th:field="*{id}">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="code" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Code <span class="text-red-500">*</span></label>
                <input id="code" type="text" th:field="*{code}" required maxlength="30"
                       class="w-full h-10 border border-neutral-border rounded px-3 text-sm font-mono uppercase focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                <p th:if="${errors != null and errors['code'] != null}" th:text="${errors['code']}" class="mt-1 text-xs text-red-500 font-semibold"></p>
            </div>
            <div class="md:col-span-2">
                <label for="libelle" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Libellé <span class="text-red-500">*</span></label>
                <input id="libelle" type="text" th:field="*{libelle}" required maxlength="100"
                       class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700">
                <p th:if="${errors != null and errors['libelle'] != null}" th:text="${errors['libelle']}" class="mt-1 text-xs text-red-500 font-semibold"></p>
            </div>
        </div>

        <div>
            <label for="description" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Description</label>
            <textarea id="description" th:field="*{description}" rows="2" maxlength="500"
                      class="w-full border border-neutral-border rounded px-3 py-2 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="categorie" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Catégorie <span class="text-red-500">*</span></label>
                <select id="categorie" th:field="*{categorie}" required
                        class="w-full h-10 border border-neutral-border rounded px-3 text-sm bg-white focus:outline-none focus:border-cobalt-700">
                    <option value="">Sélectionner</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>
            <div>
                <label for="modeDecompte" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Mode de décompte <span class="text-red-500">*</span></label>
                <select id="modeDecompte" th:field="*{modeDecompte}" required
                        class="w-full h-10 border border-neutral-border rounded px-3 text-sm bg-white focus:outline-none focus:border-cobalt-700">
                    <option value="">Sélectionner</option>
                    <option th:each="m : ${modes}" th:value="${m}"
                            th:text="${m.name() == 'OUVRES' ? 'Jours ouvrés' : 'Jours calendaires'}"></option>
                </select>
            </div>
            <div>
                <label for="couleur" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Couleur</label>
                <div class="flex items-center gap-2">
                    <input id="couleur" type="color" th:field="*{couleur}"
                           class="h-10 w-14 border border-neutral-border rounded bg-white p-1">
                    <span class="text-xs text-slate-500">Utilisée dans le calendrier.</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex flex-col gap-3 p-4 rounded bg-slate-50 border border-neutral-border">
                <label class="flex items-center gap-2 text-sm text-slate-700 font-semibold">
                    <input type="checkbox" th:field="*{paye}" class="rounded border-slate-300">
                    Congé payé
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-700 font-semibold">
                    <input type="checkbox" th:field="*{consommeSolde}" class="rounded border-slate-300">
                    Décompte un solde
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-700 font-semibold">
                    <input type="checkbox" th:field="*{demandeEmployeAutorisee}" class="rounded border-slate-300">
                    Demandable par le salarié
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-700 font-semibold">
                    <input type="checkbox" th:field="*{actif}" class="rounded border-slate-300">
                    Type actif
                </label>
            </div>

            <div class="flex flex-col gap-3 p-4 rounded bg-slate-50 border border-neutral-border">
                <label class="flex items-center gap-2 text-sm text-slate-700 font-semibold">
                    <input type="checkbox" th:field="*{justificatifRequis}" class="rounded border-slate-300">
                    Justificatif obligatoire
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="delaiJustificatifJours" class="block text-[10px] font-bold uppercase text-slate-500 tracking-wider mb-1">Délai (jours)</label>
                        <input id="delaiJustificatifJours" type="number" min="0" th:field="*{delaiJustificatifJours}"
                               class="w-full h-9 border border-neutral-border rounded px-2 text-sm">
                    </div>
                    <div>
                        <label for="dureeMaxJours" class="block text-[10px] font-bold uppercase text-slate-500 tracking-wider mb-1">Durée max (jours)</label>
                        <input id="dureeMaxJours" type="number" min="0" step="0.5" th:field="*{dureeMaxJours}"
                               class="w-full h-9 border border-neutral-border rounded px-2 text-sm">
                    </div>
                </div>
                <label class="flex items-center gap-2 text-sm text-slate-700 font-semibold">
                    <input type="checkbox" th:field="*{reportAutorise}" class="rounded border-slate-300">
                    Report annuel autorisé
                </label>
                <div>
                    <label for="plafondReportJours" class="block text-[10px] font-bold uppercase text-slate-500 tracking-wider mb-1">Plafond de report (jours)</label>
                    <input id="plafondReportJours" type="number" min="0" step="0.5" th:field="*{plafondReportJours}"
                           class="w-full h-9 border border-neutral-border rounded px-2 text-sm">
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label for="ordreAffichage" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Ordre d'affichage</label>
                <input id="ordreAffichage" type="number" min="0" th:field="*{ordreAffichage}"
                       class="w-full h-10 border border-neutral-border rounded px-3 text-sm">
            </div>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2 border-t border-neutral-border">
            <a th:href="@{/conges/types}"
               class="h-10 px-5 rounded bg-white border border-neutral-border text-slate-700 hover:bg-slate-50 text-xs font-semibold flex items-center">
                Annuler
            </a>
            <button type="submit"
                    class="h-10 px-5 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white text-xs font-semibold shadow-sm">
                Enregistrer
            </button>
        </div>
    </form>
</main>
</body>
</html>
