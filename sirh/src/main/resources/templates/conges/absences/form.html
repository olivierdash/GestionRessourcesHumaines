<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>
<main th:fragment="mainContent" class="w-full flex flex-col gap-6">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight">Nouvelle absence</h1>
            <p class="text-sm text-slate-600 mt-1">Saisie administrative d'une absence non liée à une demande de congé.</p>
        </div>
        <a th:href="@{/conges/absences}" class="text-sm text-cobalt-700 font-semibold flex items-center gap-1">
            <span class="material-symbols-outlined text-[16px]">arrow_back</span>
            Retour
        </a>
    </div>

    <div th:if="${errorMessage}" class="p-4 rounded bg-red-50 text-red-600 border border-red-200 text-sm font-semibold" th:text="${errorMessage}"></div>
    <div th:if="${errors != null and !errors.isEmpty()}" class="p-4 rounded bg-red-50 text-red-700 border border-red-200 text-sm font-semibold">
        <ul class="list-disc list-inside text-xs font-medium">
            <li th:each="e : ${errors}" th:text="${e.value}"></li>
        </ul>
    </div>

    <form th:action="@{/conges/absences}" method="post" th:object="${absence}"
          class="bg-surface-card rounded-lg border border-neutral-border shadow-sm p-6 flex flex-col gap-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="idEmploye" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Salarié <span class="text-red-500">*</span></label>
                <select id="idEmploye" th:field="*{idEmploye}" required
                        class="w-full h-10 border border-neutral-border rounded px-3 text-sm bg-white focus:outline-none focus:border-cobalt-700">
                    <option value="">Sélectionner</option>
                    <option th:each="e : ${employes}" th:value="${e.idEmployer}"
                            th:text="${e.matricule + ' — ' + e.candidature.candidat.prenom + ' ' + e.candidature.candidat.nom}"></option>
                </select>
                <p th:if="${errors != null and errors['employe'] != null}" th:text="${errors['employe']}" class="mt-1 text-xs text-red-500 font-semibold"></p>
            </div>
            <div>
                <label for="idTypeConge" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Type d'absence <span class="text-red-500">*</span></label>
                <select id="idTypeConge" th:field="*{idTypeConge}" required
                        class="w-full h-10 border border-neutral-border rounded px-3 text-sm bg-white focus:outline-none focus:border-cobalt-700">
                    <option value="">Sélectionner</option>
                    <option th:each="t : ${types}" th:value="${t.id}" th:text="${t.libelle}"></option>
                </select>
                <p th:if="${errors != null and errors['typeConge'] != null}" th:text="${errors['typeConge']}" class="mt-1 text-xs text-red-500 font-semibold"></p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="dateDebut" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Date de début <span class="text-red-500">*</span></label>
                <input id="dateDebut" type="date" th:field="*{dateDebut}" required
                       class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700">
            </div>
            <div>
                <label for="dateFin" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Date de fin <span class="text-red-500">*</span></label>
                <input id="dateFin" type="date" th:field="*{dateFin}" required
                       class="w-full h-10 border border-neutral-border rounded px-3 text-sm focus:outline-none focus:border-cobalt-700">
            </div>
        </div>
        <p th:if="${errors != null and errors['dates'] != null}" th:text="${errors['dates']}" class="text-xs text-red-500 font-semibold -mt-2"></p>

        <div>
            <label for="motif" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-2">Motif / commentaire</label>
            <textarea id="motif" th:field="*{motif}" rows="3" maxlength="500"
                      class="w-full border border-neutral-border rounded px-3 py-2 text-sm focus:outline-none focus:border-cobalt-700 focus:ring-1 focus:ring-cobalt-700"></textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2 border-t border-neutral-border">
            <a th:href="@{/conges/absences}"
               class="h-10 px-5 rounded bg-white border border-neutral-border text-slate-700 hover:bg-slate-50 text-xs font-semibold flex items-center">
                Annuler
            </a>
            <button type="submit"
                    class="h-10 px-5 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white text-xs font-semibold shadow-sm">
                Enregistrer l'absence
            </button>
        </div>
    </form>
</main>
</body>
</html>
