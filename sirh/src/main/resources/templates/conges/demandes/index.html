<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>
<main th:fragment="mainContent" class="w-full flex flex-col gap-6">

    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight">Demandes de congé</h1>
            <p class="text-sm text-slate-600 mt-1">Vue back-office de toutes les demandes.</p>
        </div>
        <div class="flex items-center gap-2 self-start md:self-auto">
            <a th:href="@{/conges/calendrier}"
               class="h-9 px-4 rounded bg-white border border-neutral-border text-slate-700 hover:bg-slate-50 text-xs font-semibold flex items-center gap-1.5 shadow-sm">
                <span class="material-symbols-outlined text-[16px]">calendar_month</span>
                Calendrier
            </a>
        </div>
    </div>

    <div th:if="${succes}" class="p-4 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-sm font-semibold shadow-sm" th:text="${succes}"></div>
    <div th:if="${erreur}" class="p-4 rounded bg-red-50 text-red-600 border border-red-200 text-sm font-semibold shadow-sm" th:text="${erreur}"></div>

    <form method="get" th:action="@{/conges/demandes}" th:object="${filter}"
          class="bg-surface-card rounded-lg border border-neutral-border shadow-sm p-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 items-end">
            <div class="lg:col-span-2">
                <label for="employeId" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-1.5">Salarié</label>
                <select id="employeId" th:field="*{employeId}"
                        class="w-full h-9 border border-neutral-border rounded px-3 text-sm bg-white focus:outline-none focus:border-cobalt-700">
                    <option value="">Tous</option>
                    <option th:each="e : ${employes}" th:value="${e.idEmployer}"
                            th:text="${e.matricule + ' — ' + e.candidature.candidat.prenom + ' ' + e.candidature.candidat.nom}"></option>
                </select>
            </div>
            <div>
                <label for="typeId" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-1.5">Type</label>
                <select id="typeId" th:field="*{typeId}"
                        class="w-full h-9 border border-neutral-border rounded px-3 text-sm bg-white focus:outline-none focus:border-cobalt-700">
                    <option value="">Tous</option>
                    <option th:each="t : ${types}" th:value="${t.id}" th:text="${t.libelle}"></option>
                </select>
            </div>
            <div>
                <label for="statut" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-1.5">Statut</label>
                <select id="statut" th:field="*{statut}"
                        class="w-full h-9 border border-neutral-border rounded px-3 text-sm bg-white focus:outline-none focus:border-cobalt-700">
                    <option value="">Tous</option>
                    <option th:each="s : ${statuts}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div>
                <label for="debut" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-1.5">Du</label>
                <input id="debut" type="date" th:field="*{debut}"
                       class="w-full h-9 border border-neutral-border rounded px-2 text-sm focus:outline-none focus:border-cobalt-700">
            </div>
            <div>
                <label for="fin" class="block text-[11px] font-bold uppercase text-slate-500 tracking-wider mb-1.5">Au</label>
                <input id="fin" type="date" th:field="*{fin}"
                       class="w-full h-9 border border-neutral-border rounded px-2 text-sm focus:outline-none focus:border-cobalt-700">
            </div>
        </div>
        <div class="flex items-center justify-end gap-2 mt-3">
            <a th:href="@{/conges/demandes}"
               class="h-8 px-3 rounded bg-white border border-neutral-border text-slate-600 hover:bg-slate-50 text-xs font-semibold flex items-center">
                Réinitialiser
            </a>
            <button type="submit"
                    class="h-8 px-4 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white text-xs font-semibold">
                Filtrer
            </button>
        </div>
    </form>

    <div class="bg-surface-card rounded-lg border border-neutral-border shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="sirh-table">
                <thead>
                    <tr>
                        <th>Référence</th>
                        <th>Salarié</th>
                        <th>Type</th>
                        <th>Période</th>
                        <th>Jours</th>
                        <th>Soumise le</th>
                        <th>Statut</th>
                        <th class="text-right">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(demandes)}">
                        <td colspan="8" class="td-empty py-8 text-center text-slate-500 italic">Aucune demande trouvée.</td>
                    </tr>
                    <tr th:each="demande : ${demandes}">
                        <td class="font-mono text-xs text-slate-600" th:text="${demande.reference}"></td>
                        <td>
                            <div class="font-semibold text-cobalt-900"
                                 th:text="${demande.employe.candidature.candidat.prenom + ' ' + demande.employe.candidature.candidat.nom}"></div>
                            <div class="text-[11px] text-slate-500 font-mono" th:text="${demande.employe.matricule}"></div>
                        </td>
                        <td class="text-sm" th:text="${demande.typeConge.libelle}"></td>
                        <td class="text-sm text-slate-700 whitespace-nowrap">
                            <span th:text="${#temporals.format(demande.dateDebut, 'dd/MM/yyyy')}"></span>
                            <span class="text-slate-400 mx-1">→</span>
                            <span th:text="${#temporals.format(demande.dateFin, 'dd/MM/yyyy')}"></span>
                        </td>
                        <td class="font-semibold" th:text="${#numbers.formatDecimal(demande.nombreJours, 1, 1)}"></td>
                        <td class="text-xs text-slate-500 whitespace-nowrap"
                            th:text="${demande.dateSoumission != null ? #temporals.format(demande.dateSoumission, 'dd/MM/yyyy') : '—'}"></td>
                        <td th:replace="~{conges/fragments/statut :: badge(${demande.statut})}"></td>
                        <td class="text-right">
                            <a th:href="@{/conges/demandes/{id}(id=${demande.id})}"
                               class="inline-flex items-center gap-1.5 h-7 px-3 rounded bg-white border border-slate-300 text-cobalt-700 hover:bg-slate-50 text-xs font-semibold">
                                <span class="material-symbols-outlined text-[14px]">visibility</span>
                                Consulter
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
