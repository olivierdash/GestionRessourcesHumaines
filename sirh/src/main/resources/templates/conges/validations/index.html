<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>
<main th:fragment="mainContent" class="w-full flex flex-col gap-6">

    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold text-cobalt-900 tracking-tight">Validation des congés</h1>
            <p class="text-sm text-slate-600 mt-1">
                <span th:text="${filtreStatut != null ? demandes.totalElements : enAttente}"></span>
                demande(s) en attente de votre décision.
            </p>
        </div>
        <div class="flex items-center gap-2 self-start md:self-auto">
            <a th:if="${filtreStatut != null}" th:href="@{/conges/validations}"
               class="h-9 px-3 rounded bg-white border border-neutral-border text-slate-600 hover:bg-slate-50 text-xs font-semibold flex items-center">
                Tous les statuts
            </a>
            <a th:href="@{/conges/calendrier}"
               class="h-9 px-4 rounded bg-white border border-neutral-border text-slate-700 hover:bg-slate-50 text-xs font-semibold flex items-center gap-1.5 shadow-sm">
                <span class="material-symbols-outlined text-[16px]">calendar_month</span>
                Calendrier
            </a>
        </div>
    </div>

    <div th:if="${succes}" class="p-4 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-sm font-semibold shadow-sm" th:text="${succes}"></div>
    <div th:if="${erreur}" class="p-4 rounded bg-red-50 text-red-600 border border-red-200 text-sm font-semibold shadow-sm" th:text="${erreur}"></div>

    <div class="bg-surface-card rounded-lg border border-neutral-border shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="sirh-table">
                <thead>
                    <tr>
                        <th>Référence</th>
                        <th>Salarié</th>
                        <th>Type</th>
                        <th>Période</th>
                        <th>Jours</th>
                        <th>Soumise le</th>
                        <th>Statut</th>
                        <th class="text-right">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(demandes.content)}">
                        <td colspan="8" class="td-empty py-8 text-center text-slate-500 italic">
                            <span th:text="${filtreStatut != null ? 'Aucune demande à traiter avec ce statut.' : 'Aucune demande en attente de votre validation.'}"></span>
                        </td>
                    </tr>
                    <tr th:each="demande : ${demandes.content}">
                        <td class="font-mono text-xs text-slate-600" th:text="${demande.reference}"></td>
                        <td>
                            <div class="font-semibold text-cobalt-900"
                                 th:text="${demande.employe.candidature.candidat.prenom + ' ' + demande.employe.candidature.candidat.nom}"></div>
                            <div class="text-[11px] text-slate-500 font-mono" th:text="${demande.employe.matricule}"></div>
                        </td>
                        <td class="text-sm" th:text="${demande.typeConge.libelle}"></td>
                        <td class="text-sm text-slate-700 whitespace-nowrap">
                            <span th:text="${#temporals.format(demande.dateDebut, 'dd/MM/yyyy')}"></span>
                            <span class="text-slate-400 mx-1">→</span>
                            <span th:text="${#temporals.format(demande.dateFin, 'dd/MM/yyyy')}"></span>
                        </td>
                        <td class="font-semibold" th:text="${@formatDuree.jours(demande.nombreJours)}"></td>
                        <td class="text-xs text-slate-500 whitespace-nowrap"
                            th:text="${demande.dateSoumission != null ? #temporals.format(demande.dateSoumission, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                        <td>
                            <a th:href="@{/conges/validations(statut=${demande.statut})}"
                               class="inline-flex rounded hover:opacity-80 focus:outline-none focus:ring-2 focus:ring-cobalt-700"
                               th:attr="aria-label=|Filtrer les validations par statut ${demande.statut}|">
                                <span th:replace="~{conges/fragments/statut :: badge(${demande.statut})}"></span>
                            </a>
                        </td>
                        <td class="text-right">
                            <a th:href="@{/conges/validations/{id}(id=${demande.id})}"
                               class="inline-flex items-center gap-1.5 h-7 px-3 rounded bg-cobalt-700 hover:bg-cobalt-800 text-white text-xs font-semibold">
                                <span class="material-symbols-outlined text-[14px]">fact_check</span>
                                Traiter
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${demandes.totalPages > 1}"
             class="flex items-center justify-center border-t border-neutral-border px-4 py-3">
            <form th:action="@{/conges/validations}" method="get" class="flex items-center gap-3">
                <input type="hidden" name="size" th:value="${demandes.size}">
                <input th:if="${filtreStatut != null}" type="hidden" name="statut" th:value="${filtreStatut}">
                <button type="submit" name="page" th:value="${demandes.number - 1}"
                        th:disabled="${demandes.first}"
                        class="h-8 px-3 rounded border border-neutral-border bg-white text-xs font-semibold text-slate-700 disabled:opacity-40">
                    Précédent
                </button>
                <span class="text-xs text-slate-600">
                    Page <span th:text="${demandes.number + 1}"></span>
                    sur <span th:text="${demandes.totalPages}"></span>
                </span>
                <button type="submit" name="page" th:value="${demandes.number + 1}"
                        th:disabled="${demandes.last}"
                        class="h-8 px-3 rounded border border-neutral-border bg-white text-xs font-semibold text-slate-700 disabled:opacity-40">
                    Suivante
                </button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
