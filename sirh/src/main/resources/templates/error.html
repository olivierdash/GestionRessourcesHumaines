<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erreur - SIRH Pro</title>
    
    <!-- 1. Tailwind CSS -->
    <script th:src="@{/js/tailwind.js}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        cobalt: {
                            950: "#0f172a", 900: "#1e3a8a", 800: "#1e40af", 
                            700: "#1d4ed8", 600: "#2563eb", 500: "#3b82f6", 50: "#eff6ff"
                        },
                        "neutral-border": "#e2e8f0",
                        "surface-bg": "#f8fafc",
                        "surface-card": "#ffffff",
                        "body-text": "#1e293b",
                        "muted-text": "#64748b"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.375rem",
                        full: "0.5rem"
                    }
                }
            }
        }
    </script>
    
    <!-- 2. Ton fichier styles.css -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>

<body class="bg-surface-bg h-screen font-sans antialiased text-body-text overflow-hidden flex items-center justify-center relative">

    <!-- Fond décoratif (Blobs) - Couleurs adaptées au design Cobalt -->
    <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-cobalt-100/50 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 left-10 w-80 h-80 rounded-full bg-slate-200/50 blur-3xl pointer-events-none"></div>

    <!-- Contenu principal -->
    <div class="relative z-10 w-full max-w-3xl px-6 py-12 flex flex-col items-center text-center">
        
        <!-- Code HTTP + Illustration -->
        <div class="relative flex items-center justify-center mb-6">
            <!-- Le code d'erreur en très grand -->
            <span class="text-[120px] leading-none font-bold tracking-tighter text-slate-200 select-none" 
                  th:text="${status != null ? status : '500'}"></span>
            
            <!-- L'illustration SVG superposée -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <svg class="w-28 h-28 text-cobalt-800 drop-shadow-md" fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <rect fill="currentColor" fill-opacity="0.08" height="72" rx="10" width="76" x="22" y="24"></rect>
                    <path d="M38 42H82M38 56H68M38 70H54" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
                    <circle cx="74" cy="74" fill="#FFFFFF" r="18"></circle>
                    <!-- Cercle d'alerte en rouge (pour le contraste et l'erreur) -->
                    <circle cx="74" cy="74" r="18" stroke="#ef4444" stroke-width="3.5"></circle>
                    <line stroke="#ef4444" stroke-linecap="round" stroke-width="4" x1="87" x2="102" y1="87" y2="102"></line>
                    <path d="M70 74H78M74 70V78" stroke="#1e3a8a" stroke-linecap="round" stroke-width="2"></path>
                </svg>
            </div>
        </div>

        <!-- Texte dynamique -->
        <h1 class="text-2xl md:text-3xl font-bold text-cobalt-900 mb-3 max-w-2xl" 
            th:text="${error != null ? error : 'Ressource RH introuvable'}">
        </h1>
        
        <p class="text-base text-slate-600 mb-8 max-w-lg leading-relaxed" 
           th:text="${message != null ? message : ''}">
        </p>

        <!-- Bouton -->
        <div class="flex items-center justify-center w-full">
            <button type="button" onclick="window.history.back()" 
                class="inline-flex items-center justify-center gap-2 h-11 px-6 bg-cobalt-700 hover:bg-cobalt-800 text-white font-semibold text-xs rounded transition-colors shadow-sm">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                <span>Page précédente</span>
            </button>
        </div>

    </div>

</body>
</html>
