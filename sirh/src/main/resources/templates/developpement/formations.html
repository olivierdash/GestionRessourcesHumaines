<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{layout :: layout(content=~{::mainContent})}">
<body>
<main th:fragment="mainContent" class="w-full flex flex-col gap-6">
    <h2 class="text-2xl font-bold text-cobalt-900">Formations</h2>
    <div th:if="${success}" class="p-3 rounded bg-emerald-50 text-emerald-800 border border-emerald-200" th:text="${success}"></div>

    <form th:action="@{/developpement/formations}" th:object="${formation}" method="post"
          class="bg-white border border-neutral-border rounded-lg p-5 grid md:grid-cols-3 gap-4">
        <input th:field="*{titre}" required maxlength="150" placeholder="Titre"
               class="h-10 px-3 border border-neutral-border rounded">
        <input th:field="*{organisme}" maxlength="150" placeholder="Organisme"
               class="h-10 px-3 border border-neutral-border rounded">
        <select th:field="*{modeFormation}" class="h-10 px-3 border border-neutral-border rounded">
            <option value="PRESENTIEL">Présentiel</option>
            <option value="DISTANCIEL">Distanciel</option>
            <option value="HYBRIDE">Hybride</option>
            <option value="E_LEARNING">E-learning</option>
        </select>
        <input th:field="*{dateDebut}" type="date" class="h-10 px-3 border border-neutral-border rounded">
        <input th:field="*{dateFin}" type="date" class="h-10 px-3 border border-neutral-border rounded">
        <input th:field="*{dureeHeures}" type="number" min="0.25" step="0.25" placeholder="Durée en heures"
               class="h-10 px-3 border border-neutral-border rounded">
        <button type="submit" class="h-10 px-4 rounded bg-cobalt-700 text-white font-semibold md:col-start-3">Ajouter</button>
    </form>

    <div class="bg-white border border-neutral-border rounded-lg overflow-x-auto">
        <table class="sirh-table">
            <thead><tr><th>Titre</th><th>Organisme</th><th>Mode</th><th>Période</th><th>Heures</th><th>Statut</th></tr></thead>
            <tbody>
                <tr th:if="${formations.isEmpty()}"><td colspan="6" class="td-empty">Aucune formation.</td></tr>
                <tr th:each="item : ${formations}">
                    <td class="font-semibold" th:text="${item.titre}"></td>
                    <td th:text="${item.organisme}"></td>
                    <td th:text="${item.modeFormation}"></td>
                    <td th:text="${item.dateDebut != null && item.dateFin != null ? #temporals.format(item.dateDebut, 'dd/MM/yyyy') + ' - ' + #temporals.format(item.dateFin, 'dd/MM/yyyy') : 'Non définie'}"></td>
                    <td th:text="${item.dureeHeures}"></td>
                    <td>
                        <form th:action="@{/developpement/formations/{id}/statut(id=${item.id})}" method="post" class="flex gap-2">
                            <select name="statut" class="h-8 px-2 border border-neutral-border rounded">
                                <option th:selected="${item.statut == 'PLANIFIEE'}" value="PLANIFIEE">Planifiée</option>
                                <option th:selected="${item.statut == 'EN_COURS'}" value="EN_COURS">En cours</option>
                                <option th:selected="${item.statut == 'TERMINEE'}" value="TERMINEE">Terminée</option>
                                <option th:selected="${item.statut == 'ANNULEE'}" value="ANNULEE">Annulée</option>
                            </select>
                            <button class="h-8 px-2 rounded border border-neutral-border text-xs">OK</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
